name: eBay Arbitrage Check
on:
  schedule:
    - cron: '0 1 * * *'  # 毎日 午前10時 JST (UTC+9)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arbitrage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: eBay Price Comparison & Discord Notify
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scrape_ebay.js
