<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Price List</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }

  /* Login */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    background: #16213e; border: 1px solid #e8b84b; border-radius: 12px;
    padding: 2.5rem; width: 360px;
  }
  .login-box h1 { color: #e8b84b; font-size: 1.4rem; margin-bottom: 1.5rem; text-align: center; }
  .login-box input {
    width: 100%; padding: 0.75rem 1rem; border-radius: 8px;
    border: 1px solid #333; background: #0f0f1a; color: #fff;
    font-size: 1rem; margin-bottom: 1rem;
  }
  .login-box input:focus { outline: none; border-color: #e8b84b; }
  .login-error { color: #ff6060; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }

  /* Admin */
  #admin-screen { display: none; }
  header {
    background: #16213e; padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid #e8b84b;
  }
  header h1 { color: #e8b84b; font-size: 1.3rem; }
  .btn {
    padding: 0.5rem 1.2rem; border-radius: 8px; border: none;
    cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #e8b84b; color: #000; }
  .btn-danger { background: #ff4444; color: #fff; }
  .btn-secondary { background: #333; color: #fff; }
  .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
  .btn-logout { background: #333; color: #aaa; }

  .token-bar {
    background: #1a1a2e; border-bottom: 1px solid #333;
    padding: 0.6rem 2rem; display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.85rem; color: #aaa;
  }
  .token-bar input {
    flex: 1; max-width: 420px; padding: 0.4rem 0.8rem;
    border-radius: 6px; border: 1px solid #333; background: #0f0f1a;
    color: #fff; font-size: 0.85rem; font-family: monospace;
  }
  .token-bar input:focus { outline: none; border-color: #e8b84b; }
  .token-status { font-size: 0.8rem; }
  .token-ok { color: #00cc66; }
  .token-ng { color: #ff6060; }

  .main { padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .toolbar select, .toolbar input {
    padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #333;
    background: #1a1a2e; color: #fff; font-size: 0.9rem;
  }
  .toolbar select:focus, .toolbar input:focus { outline: none; border-color: #e8b84b; }
  .item-count { color: #aaa; font-size: 0.85rem; margin-left: auto; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    background: #16213e; color: #e8b84b; padding: 0.75rem 1rem;
    text-align: left; border-bottom: 1px solid #333; white-space: nowrap;
  }
  td {
    padding: 0.6rem 1rem; border-bottom: 1px solid #1a1a2e;
    vertical-align: middle;
  }
  tr:hover td { background: #16213e; }
  .td-img img { width: 40px; height: 53px; object-fit: cover; border-radius: 4px; background: #111; }
  .td-name { max-width: 220px; }
  .td-name small { color: #888; display: block; }
  .td-price { color: #e8b84b; white-space: nowrap; }
  .td-stock { text-align: center; }
  .td-actions { white-space: nowrap; display: flex; gap: 0.4rem; }
  .category-badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px;
    background: #2a2a4a; font-size: 0.75rem; color: #aaa; white-space: nowrap;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 1rem;
  }
  .modal { display: none; }
  .modal.open { display: flex; }
  .modal-box {
    background: #16213e; border: 1px solid #e8b84b; border-radius: 12px;
    width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    padding: 2rem;
  }
  .modal-box h2 { color: #e8b84b; margin-bottom: 1.5rem; font-size: 1.2rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 0.4rem; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 0.6rem 0.9rem; border-radius: 8px;
    border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 0.9rem;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #e8b84b;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
  .img-preview {
    width: 60px; height: 80px; object-fit: cover; border-radius: 4px;
    background: #111; border: 1px solid #333; margin-top: 0.4rem;
    display: none;
  }

  /* Confirm modal */
  .confirm-box {
    background: #16213e; border: 1px solid #ff4444; border-radius: 12px;
    width: 100%; max-width: 400px; padding: 2rem; text-align: center;
  }
  .confirm-box h2 { color: #ff6060; margin-bottom: 1rem; }
  .confirm-box p { color: #ccc; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .confirm-actions { display: flex; gap: 0.75rem; justify-content: center; }

  /* Toast */
  #toast {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;
    background: #1a1a2e; border: 1px solid #e8b84b; border-radius: 8px;
    padding: 0.8rem 1.4rem; font-size: 0.9rem; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: #ff4444; color: #ff6060; }
  #toast.success { border-color: #00cc66; color: #00cc66; }

  .saving-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000; display: none;
  }
  .saving-box { background: #16213e; border: 1px solid #e8b84b; border-radius: 12px; padding: 2rem 3rem; text-align: center; color: #e8b84b; font-size: 1.1rem; }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex; gap: 0; border-bottom: 2px solid #333;
    margin-bottom: 1.5rem;
  }
  .tab-btn {
    padding: 0.65rem 1.6rem; border: none; cursor: pointer;
    background: transparent; color: #888; font-size: 0.95rem;
    font-weight: bold; border-bottom: 3px solid transparent;
    margin-bottom: -2px; transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn.active { color: #e8b84b; border-bottom-color: #e8b84b; }
  .tab-btn:hover:not(.active) { color: #ccc; }

  /* ── LINE取込 UI ── */
  #tab-line { display: none; }
  .line-textarea {
    width: 100%; min-height: 260px; padding: 1rem;
    border-radius: 8px; border: 1px solid #333;
    background: #0f0f1a; color: #fff; font-size: 0.88rem;
    font-family: 'Segoe UI', sans-serif; resize: vertical;
    line-height: 1.6;
  }
  .line-textarea:focus { outline: none; border-color: #e8b84b; }
  .line-controls { display: flex; gap: 0.75rem; align-items: center; margin: 0.75rem 0 1.5rem; }
  .parse-summary { color: #aaa; font-size: 0.85rem; }

  /* preview table */
  .line-preview-wrap { overflow-x: auto; }
  #line-preview-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  #line-preview-table th {
    background: #16213e; color: #e8b84b; padding: 0.65rem 0.8rem;
    text-align: left; border-bottom: 1px solid #333; white-space: nowrap;
  }
  #line-preview-table td { padding: 0.55rem 0.8rem; border-bottom: 1px solid #1a1a2e; vertical-align: middle; }
  #line-preview-table tr.row-matched td { }
  #line-preview-table tr.row-price-changed td { background: rgba(232,184,75,0.06); }
  #line-preview-table tr.row-unmatched td { background: rgba(255,68,68,0.07); }
  .match-badge { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 10px; font-size: 0.75rem; font-weight: bold; }
  .badge-ok { background: #0d3d1f; color: #00cc66; }
  .badge-new { background: #3d2a0d; color: #ffa040; }
  .badge-skip { background: #2a2a2a; color: #666; }
  .price-old { color: #888; text-decoration: line-through; margin-right: 0.4rem; }
  .price-new { color: #e8b84b; font-weight: bold; }
  .price-same { color: #888; }
  .shrink-badge { font-size: 0.72rem; padding: 0.1rem 0.4rem; border-radius: 8px; background: #1a2a3a; color: #6ab; margin-left: 0.3rem; }
  .cat-select-inline { padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 0.78rem; max-width: 220px; }
  .line-apply-bar { display: flex; gap: 1rem; align-items: center; margin-top: 1.2rem; flex-wrap: wrap; }
  .apply-count { color: #aaa; font-size: 0.85rem; }

  /* 業者ブロック */
  .supplier-block {
    background: #111827; border: 1px solid #2a2a4a; border-radius: 10px;
    padding: 1rem; margin-bottom: 0.8rem;
  }
  .supplier-block-header { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.6rem; }
  .supplier-name-input {
    padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #333;
    background: #0f0f1a; color: #fff; font-size: 0.88rem; width: 180px;
  }
  .supplier-name-input:focus { outline: none; border-color: #e8b84b; }
  .supplier-label { color: #888; font-size: 0.82rem; }
  .btn-remove-supplier { background: transparent; border: 1px solid #444; color: #888; border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; margin-left: auto; }
  .btn-remove-supplier:hover { border-color: #ff4444; color: #ff4444; }

  /* 比較テーブルの業者価格セル */
  .supplier-price-cell { text-align: center; min-width: 90px; }
  .sp-price { font-size: 0.85rem; font-weight: bold; }
  .sp-qty { font-size: 0.72rem; color: #888; }
  .sp-best { color: #00cc66; }
  .sp-none { color: #444; }
  .price-select {
    padding: 0.25rem 0.4rem; border-radius: 6px; border: 1px solid #333;
    background: #0f0f1a; color: #e8b84b; font-size: 0.82rem;
    font-weight: bold; max-width: 130px;
  }
  .price-select:focus { outline: none; border-color: #e8b84b; }
  .carton-note { font-size: 0.7rem; color: #fa0; background: #2a1f00; padding: 0.1rem 0.4rem; border-radius: 8px; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔐 Admin Login</h1>
    <p class="login-error" id="login-error">パスワードが違います</p>
    <input type="password" id="password-input" placeholder="パスワード" autocomplete="current-password">
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- Admin -->
<div id="admin-screen">
  <header>
    <h1>🎴 Admin Panel</h1>
    <button class="btn btn-logout" onclick="doLogout()">ログアウト</button>
  </header>

  <div class="token-bar">
    <span>GitHub Token:</span>
    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" oninput="saveToken()">
    <span class="token-status" id="token-status"></span>
    <a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank" style="color:#888;font-size:0.8rem">トークン取得</a>
  </div>

  <div class="main">
    <!-- タブバー -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabBtn-items" onclick="switchTab('items')">📋 商品一覧</button>
      <button class="tab-btn" id="tabBtn-line" onclick="switchTab('line')">📲 LINE取込</button>
    </div>

    <!-- 商品一覧タブ -->
    <div id="tab-items">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openAddModal()">＋ 商品追加</button>
        <select id="filter-cat" onchange="resetAndRender()">
          <option value="">全カテゴリ</option>
        </select>
        <input type="text" id="filter-search" placeholder="商品名で検索..." oninput="debounceRender()" style="min-width:200px">
        <span class="item-count" id="item-count"></span>
      </div>

      <div class="table-wrap">
        <table id="product-table">
          <thead>
            <tr>
              <th>画像</th>
              <th>商品名</th>
              <th>カテゴリ</th>
              <th>価格</th>
              <th>在庫</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div id="pagination" style="display:flex;gap:0.5rem;align-items:center;justify-content:center;padding:1.5rem 0;flex-wrap:wrap;"></div>
    </div>

    <!-- LINE取込タブ -->
    <div id="tab-line">
      <p style="color:#aaa;font-size:0.88rem;margin-bottom:1rem">
        複数業者のLINEメッセージを貼り付けて比較・集約できます。業者ごとにブロックを追加してください。
      </p>

      <!-- 業者ブロック一覧 -->
      <div id="supplier-blocks"></div>
      <button class="btn btn-secondary" style="margin-bottom:1.2rem" onclick="addSupplierBlock()">＋ 業者を追加</button>

      <div class="line-controls">
        <button class="btn btn-primary" onclick="parseAndPreview()">🔍 解析・比較する</button>
        <button class="btn btn-secondary" onclick="clearAllSuppliers()">クリア</button>
        <span class="parse-summary" id="parse-summary"></span>
      </div>

      <div id="line-preview-section" style="display:none">
        <div class="line-preview-wrap">
          <table id="line-preview-table">
            <thead id="line-preview-thead">
              <tr>
                <th><input type="checkbox" id="check-all" onchange="toggleAllChecks(this.checked)"></th>
                <th>LINE商品名</th>
                <th>マッチ商品</th>
                <th>カテゴリ</th>
                <!-- 業者列はJS側で動的追加 -->
                <th>適用価格</th>
                <th>旧価格</th>
                <th>状態</th>
              </tr>
            </thead>
            <tbody id="line-preview-body"></tbody>
          </table>
        </div>
        <div class="line-apply-bar">
          <button class="btn btn-primary" onclick="applyLineImport()">✅ 選択した項目をGitHubに保存</button>
          <span class="apply-count" id="apply-count"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal modal-overlay" id="edit-modal">
  <div class="modal-box">
    <h2 id="modal-title">商品追加</h2>
    <div class="form-group">
      <label>カテゴリ *</label>
      <select id="f-category" onchange="handleCatChange()"></select>
    </div>
    <div class="form-group" id="new-cat-group" style="display:none">
      <label>新規カテゴリ名 *</label>
      <input type="text" id="f-new-category" placeholder="例: ポケカシングル">
    </div>
    <div class="form-group">
      <label>商品名（日本語）*</label>
      <input type="text" id="f-name" placeholder="例: ピカチュウ【AR】{001/100}">
    </div>
    <div class="form-group">
      <label>商品名（英語）</label>
      <input type="text" id="f-nameEn" placeholder="例: Pikachu【AR】{001/100}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>価格 *</label>
        <input type="text" id="f-price" placeholder="例: 1,200円(税込)">
      </div>
      <div class="form-group">
        <label>在庫数</label>
        <input type="number" id="f-stock" placeholder="0" min="0">
      </div>
    </div>
    <div class="form-group">
      <label>画像URL</label>
      <input type="url" id="f-img" placeholder="https://..." oninput="previewImg()">
      <img id="img-preview" class="img-preview" alt="preview">
    </div>
    <div class="form-group">
      <label>商品リンクURL</label>
      <input type="url" id="f-link" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>モデル番号</label>
      <input type="text" id="f-modelNum" placeholder="例: IAP2300021830A">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('edit-modal')">キャンセル</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveItem()">保存する</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="modal modal-overlay" id="confirm-modal">
  <div class="confirm-box">
    <h2>削除確認</h2>
    <p id="confirm-msg">この商品を削除しますか？</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" onclick="closeModal('confirm-modal')">キャンセル</button>
      <button class="btn btn-danger" id="confirm-ok-btn">削除する</button>
    </div>
  </div>
</div>

<!-- Saving overlay -->
<div class="saving-overlay" id="saving-overlay">
  <div class="saving-box">💾 GitHubに保存中...</div>
</div>

<div id="toast"></div>

<script>
const PASS_HASH = 'fab853b51a79a680720749e5ca5b7c86fa0fa8fde87595a80ae014d2739a80b5';
const REPO = 'kyosuke-takei/pricelist';
const FILE_PATH = 'data.json';

let data = [];
let editTarget = null;
let currentPage = 1;
const PAGE_SIZE = 50;
let debounceTimer = null;

// ── Auth ──────────────────────────────────────────
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function doLogin() {
  const pw = document.getElementById('password-input').value;
  const hash = await sha256(pw);
  if (hash === PASS_HASH) {
    sessionStorage.setItem('admin', '1');
    showAdmin();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('password-input').value = '';
  }
}

document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogout() {
  sessionStorage.removeItem('admin');
  location.reload();
}

// ── Token ──────────────────────────────────────────
function saveToken() {
  const t = document.getElementById('gh-token').value.trim();
  if (t) localStorage.setItem('gh_token', t);
  document.getElementById('token-status').textContent = t ? '✓ 設定済' : '';
  document.getElementById('token-status').className = 'token-status ' + (t ? 'token-ok' : '');
}

function loadToken() {
  const t = localStorage.getItem('gh_token') || '';
  if (t) {
    document.getElementById('gh-token').value = t;
    document.getElementById('token-status').textContent = '✓ 設定済';
    document.getElementById('token-status').className = 'token-status token-ok';
  }
}

// ── Init ──────────────────────────────────────────
async function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  loadToken();
  await loadData();
}

async function loadData() {
  try {
    const res = await fetch(`data.json?_=${Date.now()}`);
    data = await res.json();
    refreshCategoryFilter();
    renderTable();
  } catch (e) {
    showToast('data.json の読み込みに失敗しました', 'error');
  }
}

// ── Category helpers ──────────────────────────────
function getCategories() {
  return data.map(g => g.label);
}

function refreshCategoryFilter() {
  const sel = document.getElementById('filter-cat');
  const current = sel.value;
  sel.innerHTML = '<option value="">全カテゴリ</option>';
  getCategories().forEach(label => {
    const opt = document.createElement('option');
    opt.value = label;
    opt.textContent = label;
    sel.appendChild(opt);
  });
  if (current) sel.value = current;
}

function refreshCategorySelect(selectedLabel) {
  const sel = document.getElementById('f-category');
  sel.innerHTML = '';
  getCategories().forEach(label => {
    const opt = document.createElement('option');
    opt.value = label;
    opt.textContent = label;
    sel.appendChild(opt);
  });
  const newOpt = document.createElement('option');
  newOpt.value = '__new__';
  newOpt.textContent = '＋ 新規カテゴリを追加';
  sel.appendChild(newOpt);
  if (selectedLabel) sel.value = selectedLabel;
}

function handleCatChange() {
  const val = document.getElementById('f-category').value;
  document.getElementById('new-cat-group').style.display = val === '__new__' ? 'block' : 'none';
}

// ── Table ──────────────────────────────────────────
function debounceRender() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { currentPage = 1; renderTable(); }, 200);
}

function resetAndRender() {
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const catFilter = document.getElementById('filter-cat').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  // フィルタ済みの全アイテムをフラットリストに
  const filtered = [];
  data.forEach((group, catIdx) => {
    if (catFilter && group.label !== catFilter) return;
    group.items.forEach((item, itemIdx) => {
      const name = (item.name || '') + (item.nameEn || '');
      if (search && !name.toLowerCase().includes(search)) return;
      filtered.push({ group, catIdx, item, itemIdx });
    });
  });

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  pageItems.forEach(({ group, catIdx, item, itemIdx }) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-img"><img src="${item.img || ''}" alt="" loading="lazy" onerror="this.style.display='none'"></td>
      <td class="td-name">
        <div>${escHtml(item.name || '')}</div>
        <small>${escHtml(item.nameEn || '')}</small>
      </td>
      <td><span class="category-badge">${escHtml(group.label)}</span></td>
      <td class="td-price">${escHtml(item.price || '')}</td>
      <td class="td-stock">${item.stock ?? '-'}</td>
      <td class="td-actions">
        <button class="btn btn-secondary btn-sm" onclick="openEditModal(${catIdx},${itemIdx})">編集</button>
        <button class="btn btn-danger btn-sm" onclick="openDeleteConfirm(${catIdx},${itemIdx})">削除</button>
      </td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('item-count').textContent = `${total} 件`;
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (totalPages <= 1) return;

  const btnStyle = 'padding:0.4rem 0.8rem;border-radius:6px;border:1px solid #333;background:#1a1a2e;color:#fff;cursor:pointer;font-size:0.85rem;';
  const activStyle = 'padding:0.4rem 0.8rem;border-radius:6px;border:1px solid #e8b84b;background:#e8b84b;color:#000;cursor:pointer;font-size:0.85rem;font-weight:bold;';

  const addBtn = (label, page, disabled) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = page === currentPage ? activStyle : btnStyle;
    if (disabled) { b.disabled = true; b.style.opacity = '0.4'; }
    b.onclick = () => { currentPage = page; renderTable(); window.scrollTo(0,0); };
    pg.appendChild(b);
  };

  addBtn('«', 1, currentPage === 1);
  addBtn('‹', currentPage - 1, currentPage === 1);

  // 前後2ページを表示
  for (let p = Math.max(1, currentPage - 2); p <= Math.min(totalPages, currentPage + 2); p++) {
    addBtn(p, p, false);
  }

  addBtn('›', currentPage + 1, currentPage === totalPages);
  addBtn('»', totalPages, currentPage === totalPages);

  const info = document.createElement('span');
  info.textContent = `${currentPage} / ${totalPages} ページ`;
  info.style.cssText = 'color:#888;font-size:0.8rem;';
  pg.appendChild(info);
}

async function saveItem() {
  const catSel = document.getElementById('f-category').value;
  const isNewCat = catSel === '__new__';
  const newCatName = document.getElementById('f-new-category').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const price = document.getElementById('f-price').value.trim();

  if (!name) { showToast('商品名（日本語）は必須です', 'error'); return; }
  if (!price) { showToast('価格は必須です', 'error'); return; }
  if (isNewCat && !newCatName) { showToast('新規カテゴリ名を入力してください', 'error'); return; }

  const catLabel = isNewCat ? newCatName : catSel;

  const item = {
    name,
    nameEn: document.getElementById('f-nameEn').value.trim() || undefined,
    price,
    stock: document.getElementById('f-stock').value !== '' ? parseInt(document.getElementById('f-stock').value) : undefined,
    img: document.getElementById('f-img').value.trim() || undefined,
    link: document.getElementById('f-link').value.trim() || undefined,
    modelNum: document.getElementById('f-modelNum').value.trim() || undefined,
  };
  // undefinedキーを除去
  Object.keys(item).forEach(k => item[k] === undefined && delete item[k]);

  const newData = JSON.parse(JSON.stringify(data));

  if (editTarget) {
    const { catIdx, itemIdx } = editTarget;
    const oldLabel = newData[catIdx].label;
    if (oldLabel !== catLabel) {
      // カテゴリ変更: 元から削除して新しいカテゴリへ
      newData[catIdx].items.splice(itemIdx, 1);
      if (newData[catIdx].items.length === 0) newData.splice(catIdx, 1);
      addItemToCategory(newData, catLabel, item);
    } else {
      newData[catIdx].items[itemIdx] = item;
    }
  } else {
    addItemToCategory(newData, catLabel, item);
  }

  await commitData(newData);
}

function addItemToCategory(newData, catLabel, item) {
  const catIdx = newData.findIndex(g => g.label === catLabel);
  if (catIdx >= 0) {
    newData[catIdx].items.push(item);
  } else {
    newData.push({ label: catLabel, items: [item] });
  }
}

// ── Delete ──────────────────────────────────────────
function openDeleteConfirm(catIdx, itemIdx) {
  const item = data[catIdx].items[itemIdx];
  document.getElementById('confirm-msg').textContent = `「${item.name}」を削除しますか？`;
  const btn = document.getElementById('confirm-ok-btn');
  btn.onclick = async () => {
    closeModal('confirm-modal');
    const newData = JSON.parse(JSON.stringify(data));
    newData[catIdx].items.splice(itemIdx, 1);
    if (newData[catIdx].items.length === 0) newData.splice(catIdx, 1);
    await commitData(newData);
  };
  openModal('confirm-modal');
}

// ── GitHub API ──────────────────────────────────────
async function commitData(newData) {
  const token = (document.getElementById('gh-token').value || localStorage.getItem('gh_token') || '').trim();
  if (!token) {
    showToast('GitHub Tokenを入力してください', 'error');
    return;
  }

  showSaving(true);
  try {
    // 現在のファイルのSHAを取得
    const metaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!metaRes.ok) throw new Error(`GitHub API error: ${metaRes.status}`);
    const meta = await metaRes.json();

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
    const updateRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Admin: ${editTarget ? '商品更新' : '商品追加'} - ${new Date().toLocaleString('ja-JP')}`,
        content,
        sha: meta.sha
      })
    });

    if (!updateRes.ok) {
      const err = await updateRes.json();
      throw new Error(err.message || updateRes.status);
    }

    data = newData;
    refreshCategoryFilter();
    renderTable();
    closeModal('edit-modal');
    showToast('GitHubに保存しました ✓', 'success');
  } catch (e) {
    showToast('保存失敗: ' + e.message, 'error');
  } finally {
    showSaving(false);
  }
}

// ── LINE取込: 定数 ────────────────────────────────
const BOX_CATS_SHRINK   = ['ポケカ未開封BOX', 'ワンピース未開封BOX', '未開封BOX シュリンクあり', '遊戯王 BOX シュリンクあり', 'ヴァイス BOX シュリンクあり'];
const BOX_CATS_NOSHRINK = ['未開封BOX シュリンクなし', '遊戯王 BOX シュリンクなし', 'ヴァイス BOX シュリンクなし'];
const BOX_CATS_ALL      = [...BOX_CATS_SHRINK, ...BOX_CATS_NOSHRINK];

// ── LINE取込: パーサー ────────────────────────────
function normalize(str) {
  return (str || '')
    .toLowerCase()
    .replace(/[　\s]/g, '')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[－ー]/g, '-')
    .replace(/[（(][^）)]*[）)]/g, ''); // 括弧内注記を除去してマッチ精度向上
}

function parseLineText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const results = [];
  let currentName = null;

  // 商品名行: ☑️ ✅ ・ ◆ など
  const nameRe = /^[☑✅・◆▶►▷◇●○■□★☆]\s*[️\s]*/u;
  // セクション見出し: 絵文字サンドイッチ（🔴ポケモンカード在庫品🔴 など）→ スキップ
  const sectionRe = /^\p{Emoji_Presentation}.*\p{Emoji_Presentation}\s*$/u;
  // 価格行: N BOX/パック/カートン/個 @ 価格円（円は任意）
  const priceRe = /^(\d[\d,]*)\s*(BOX|ボックス|パック|pack|カートン|個)\s*[@＠]\s*([\d,]+)円?(.*)?$/i;

  for (const line of lines) {
    // セクション見出しはスキップ
    if (sectionRe.test(line)) { currentName = null; continue; }

    if (nameRe.test(line)) {
      currentName = line.replace(nameRe, '').trim();
      continue;
    }
    if (!currentName) continue;

    const m = priceRe.exec(line);
    if (!m) continue;

    const qty   = parseInt(m[1].replace(/,/g, ''), 10);
    const unit  = m[2].toUpperCase();
    const price = parseInt(m[3].replace(/,/g, ''), 10);
    const note  = (m[4] || '').trim();

    // カートンはそのまま記録（unit='カートン'でフラグ立て）
    const isCarton = /カートン/i.test(unit);
    // シュリなし判定: 明示的な記載 or 白箱
    const shrink = !/シュリなし|シュリンクなし|白箱/i.test(note);

    results.push({ lineName: currentName, qty, price, shrink, isCarton, note });
  }
  return results;
}

// ── LINE取込: マッチング ──────────────────────────
function findMatch(lineName, shrink) {
  const needle = normalize(lineName);
  const targetCats = shrink ? BOX_CATS_SHRINK : BOX_CATS_NOSHRINK;

  let best = null;
  let bestScore = 0;

  const score = (item, catLabel) => {
    const fields = [item.name, item.nameJp, item.nameEn].filter(Boolean).map(normalize);
    let s = 0;
    for (const f of fields) {
      if (f.includes(needle) || needle.includes(f)) {
        const overlap = Math.min(needle.length, f.length) / Math.max(needle.length, f.length);
        s = Math.max(s, overlap * (f.includes(needle) ? 1.2 : 1.0));
      }
    }
    if (targetCats.includes(catLabel)) s += 0.1;
    if (BOX_CATS_ALL.includes(catLabel)) s += 0.05;
    return s;
  };

  data.forEach((group, catIdx) => {
    if (!BOX_CATS_ALL.includes(group.label)) return;
    group.items.forEach((item, itemIdx) => {
      const s = score(item, group.label);
      if (s > bestScore) { bestScore = s; best = { catIdx, itemIdx, score: s }; }
    });
  });

  return bestScore >= 0.25 ? best : null;
}

function formatPrice(yen) {
  return '¥' + yen.toLocaleString('ja-JP');
}

// ── LINE取込: 集約・比較グループ作成 ──────────────
let lineGroups = []; // 集約後のグループ

function buildGroups(suppliers) {
  // key → group
  const map = new Map();

  suppliers.forEach((sup, supIdx) => {
    const parsed = parseLineText(sup.text);
    parsed.forEach(p => {
      const match = findMatch(p.lineName, p.shrink);
      // グループキー: マッチあり→ catIdx:itemIdx、なし→ "u:正規化名"
      const key = match
        ? `m:${match.catIdx}:${match.itemIdx}`
        : `u:${normalize(p.lineName)}:${p.shrink ? '1' : '0'}`;

      if (!map.has(key)) {
        map.set(key, {
          key, lineName: p.lineName, match,
          shrink: p.shrink,
          supplierEntries: [], // { supIdx, name, qty, price, isCarton, note }
          checked: true,
          selectedPrice: null, // 適用する価格（後で決定）
          overrideCat: null,
        });
      }
      const g = map.get(key);
      // 同じ業者から複数ある場合もpush（カートンとBOXが混在するケース）
      g.supplierEntries.push({ supIdx, supName: sup.name, qty: p.qty, price: p.price, isCarton: p.isCarton, note: p.note });
      // BOX優先で lineName を上書き（より正確な名前が後に来る場合への対応）
      if (!p.isCarton) g.lineName = p.lineName;
    });
  });

  // 各グループのデフォルト適用価格を最安値BOXに設定
  map.forEach(g => {
    const boxEntries = g.supplierEntries.filter(e => !e.isCarton);
    if (boxEntries.length) {
      g.selectedPrice = Math.min(...boxEntries.map(e => e.price));
    } else {
      g.selectedPrice = Math.min(...g.supplierEntries.map(e => e.price));
    }
  });

  return Array.from(map.values());
}

// ── LINE取込: プレビュー描画 ──────────────────────
function parseAndPreview() {
  const suppliers = getSuppliers();
  if (!suppliers.length) { showToast('テキストを貼り付けてください', 'error'); return; }

  lineGroups = buildGroups(suppliers);

  const totalEntries = lineGroups.reduce((s, g) => s + g.supplierEntries.length, 0);
  const matched = lineGroups.filter(g => g.match).length;
  document.getElementById('parse-summary').textContent =
    `${lineGroups.length} 商品 (${totalEntries} エントリ) 検出 / マッチ: ${matched} 件`;

  renderLinePreview(suppliers);
  document.getElementById('line-preview-section').style.display = lineGroups.length ? 'block' : 'none';
  updateApplyCount();
}

function renderLinePreview(suppliers) {
  suppliers = suppliers || getSuppliers();
  const supNames = suppliers.map((s, i) => s.name || `業者${i + 1}`);

  // ヘッダー行を再構築（業者数に応じて列追加）
  const thead = document.getElementById('line-preview-thead');
  thead.innerHTML = `<tr>
    <th><input type="checkbox" id="check-all" onchange="toggleAllChecks(this.checked)"></th>
    <th>LINE商品名</th>
    <th>マッチ商品</th>
    <th>カテゴリ</th>
    ${supNames.map(n => `<th class="supplier-price-cell">${escHtml(n)}</th>`).join('')}
    <th>適用価格</th>
    <th>旧価格</th>
    <th>状態</th>
  </tr>`;

  const tbody = document.getElementById('line-preview-body');
  tbody.innerHTML = '';

  lineGroups.forEach((g, idx) => {
    const { match, lineName, shrink, supplierEntries, checked, selectedPrice, overrideCat } = g;

    let matchedName = '', catLabel = '', oldPrice = '', rowClass = 'row-unmatched';
    if (match) {
      const item = data[match.catIdx].items[match.itemIdx];
      matchedName = item.name || item.nameJp || '';
      catLabel = data[match.catIdx].label;
      oldPrice = item.price || '';
      rowClass = 'row-price-changed';
    }

    const shrinkBadge = shrink
      ? '<span class="shrink-badge">シュリあり</span>'
      : '<span class="shrink-badge" style="background:#2a1a1a;color:#f86">シュリなし</span>';

    // 各業者の価格セル
    const supCells = supNames.map((sName, sIdx) => {
      const entries = supplierEntries.filter(e => e.supIdx === sIdx);
      if (!entries.length) return `<td class="supplier-price-cell"><span class="sp-none">—</span></td>`;

      const best = Math.min(...entries.filter(e => !e.isCarton).map(e => e.price).concat([Infinity]));
      return `<td class="supplier-price-cell">${entries.map(e => {
        const isBest = !e.isCarton && e.price === best;
        return `<div>
          <span class="sp-price ${!e.isCarton && isBest ? 'sp-best' : ''}">${formatPrice(e.price)}</span>
          ${e.isCarton ? '<span class="carton-note">カートン</span>' : ''}
          <br><span class="sp-qty">${e.qty}${e.isCarton ? '個' : 'BOX'}${e.note ? ' ' + e.note : ''}</span>
        </div>`;
      }).join('')}</td>`;
    });

    // 適用価格セレクト（業者ごとのBOX価格を選択肢に）
    const priceOptions = [...new Map(
      supplierEntries.filter(e => !e.isCarton).map(e => [e.price, e])
    ).values()];
    const priceSelect = priceOptions.length
      ? `<select class="price-select" onchange="setSelectedPrice(${idx}, +this.value)">
          ${priceOptions.map(e =>
            `<option value="${e.price}" ${e.price === selectedPrice ? 'selected' : ''}>${formatPrice(e.price)}（${escHtml(e.supName)}）</option>`
          ).join('')}
        </select>`
      : `<span style="color:#888">—</span>`;

    const oldPriceCell = oldPrice
      ? (oldPrice !== formatPrice(selectedPrice || 0)
          ? `<span class="price-old">${escHtml(oldPrice)}</span>`
          : `<span class="price-same">${escHtml(oldPrice)}</span>`)
      : '<span style="color:#666">—</span>';

    const badge = match
      ? '<span class="match-badge badge-ok">マッチ</span>'
      : '<span class="match-badge badge-new">未マッチ</span>';

    let catCell = match
      ? `<span class="category-badge">${escHtml(catLabel)}</span>`
      : `<select class="cat-select-inline" onchange="setOverrideCat(${idx}, this.value)">
          <option value="">カテゴリ選択</option>
          ${BOX_CATS_ALL.map(c => `<option value="${escHtml(c)}" ${overrideCat === c ? 'selected' : ''}>${escHtml(c)}</option>`).join('')}
        </select>`;

    const tr = document.createElement('tr');
    tr.className = rowClass;
    tr.innerHTML = `
      <td><input type="checkbox" ${checked ? 'checked' : ''} onchange="setChecked(${idx}, this.checked)"></td>
      <td>${escHtml(lineName)}${shrinkBadge}</td>
      <td style="max-width:200px;font-size:0.78rem">${match ? escHtml(matchedName) : '<span style="color:#666">—</span>'}</td>
      <td>${catCell}</td>
      ${supCells.join('')}
      <td>${priceSelect}</td>
      <td>${oldPriceCell}</td>
      <td>${badge}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('check-all').checked = lineGroups.every(g => g.checked);
}

function setChecked(idx, val) {
  lineGroups[idx].checked = val;
  updateApplyCount();
  document.getElementById('check-all').checked = lineGroups.every(g => g.checked);
}

function toggleAllChecks(val) {
  lineGroups.forEach(g => g.checked = val);
  renderLinePreview();
  updateApplyCount();
}

function setOverrideCat(idx, catLabel) {
  lineGroups[idx].overrideCat = catLabel || null;
}

function setSelectedPrice(idx, price) {
  lineGroups[idx].selectedPrice = price;
}

function updateApplyCount() {
  const n = lineGroups.filter(g => g.checked).length;
  document.getElementById('apply-count').textContent = `${n} 件を適用します`;
}

// ── LINE取込: 一括適用 ────────────────────────────
async function applyLineImport() {
  const targets = lineGroups.filter(g => g.checked);
  if (!targets.length) { showToast('適用する項目がありません', 'error'); return; }

  const newData = JSON.parse(JSON.stringify(data));
  let updated = 0;

  for (const g of targets) {
    const { match, overrideCat, selectedPrice, lineName, supplierEntries } = g;
    if (!selectedPrice) continue;
    const newPrice = formatPrice(selectedPrice);

    if (match) {
      newData[match.catIdx].items[match.itemIdx].price = newPrice;
      updated++;
    } else if (overrideCat) {
      const catIdx = newData.findIndex(cat => cat.label === overrideCat);
      const maxQty = Math.max(...supplierEntries.filter(e => !e.isCarton).map(e => e.qty));
      const newItem = { name: lineName, price: newPrice, stock: isFinite(maxQty) ? maxQty : 0 };
      if (catIdx >= 0) newData[catIdx].items.push(newItem);
      else newData.push({ label: overrideCat, items: [newItem] });
      updated++;
    }
  }

  if (!updated) { showToast('更新できる項目がありません（未マッチかつカテゴリ未選択）', 'error'); return; }

  const token = (document.getElementById('gh-token').value || localStorage.getItem('gh_token') || '').trim();
  if (!token) { showToast('GitHub Tokenを入力してください', 'error'); return; }

  showSaving(true);
  try {
    const metaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!metaRes.ok) throw new Error(`GitHub API error: ${metaRes.status}`);
    const meta = await metaRes.json();

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
    const updateRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `LINE取込: ${updated}件更新 - ${new Date().toLocaleString('ja-JP')}`,
        content,
        sha: meta.sha
      })
    });
    if (!updateRes.ok) {
      const err = await updateRes.json();
      throw new Error(err.message || updateRes.status);
    }
    data = newData;
    refreshCategoryFilter();
    renderTable();
    showToast(`${updated} 件をGitHubに保存しました ✓`, 'success');
    document.getElementById('line-preview-section').style.display = 'none';
    document.getElementById('parse-summary').textContent = '';
  } catch(e) {
    showToast('保存失敗: ' + e.message, 'error');
  } finally {
    showSaving(false);
  }
}

// ── Boot ──────────────────────────────────────────
if (sessionStorage.getItem('admin') === '1') {
  showAdmin();
}
// LINE取込タブ初期化（ページ読み込み時に業者ブロックを1つ用意）
addSupplierBlock();
</script>
