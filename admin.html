<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Price List</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }

  /* Login */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    background: #16213e; border: 1px solid #e8b84b; border-radius: 12px;
    padding: 2.5rem; width: 360px;
  }
  .login-box h1 { color: #e8b84b; font-size: 1.4rem; margin-bottom: 1.5rem; text-align: center; }
  .login-box input {
    width: 100%; padding: 0.75rem 1rem; border-radius: 8px;
    border: 1px solid #333; background: #0f0f1a; color: #fff;
    font-size: 1rem; margin-bottom: 1rem;
  }
  .login-box input:focus { outline: none; border-color: #e8b84b; }
  .login-error { color: #ff6060; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }

  /* Admin */
  #admin-screen { display: none; }
  header {
    background: #16213e; padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid #e8b84b;
  }
  header h1 { color: #e8b84b; font-size: 1.3rem; }
  .btn {
    padding: 0.5rem 1.2rem; border-radius: 8px; border: none;
    cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #e8b84b; color: #000; }
  .btn-danger { background: #ff4444; color: #fff; }
  .btn-secondary { background: #333; color: #fff; }
  .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
  .btn-logout { background: #333; color: #aaa; }

  .token-bar {
    background: #1a1a2e; border-bottom: 1px solid #333;
    padding: 0.6rem 2rem; display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.85rem; color: #aaa;
  }
  .token-bar input {
    flex: 1; max-width: 420px; padding: 0.4rem 0.8rem;
    border-radius: 6px; border: 1px solid #333; background: #0f0f1a;
    color: #fff; font-size: 0.85rem; font-family: monospace;
  }
  .token-bar input:focus { outline: none; border-color: #e8b84b; }
  .token-status { font-size: 0.8rem; }
  .token-ok { color: #00cc66; }
  .token-ng { color: #ff6060; }

  .main { padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .toolbar select, .toolbar input {
    padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #333;
    background: #1a1a2e; color: #fff; font-size: 0.9rem;
  }
  .toolbar select:focus, .toolbar input:focus { outline: none; border-color: #e8b84b; }
  .item-count { color: #aaa; font-size: 0.85rem; margin-left: auto; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    background: #16213e; color: #e8b84b; padding: 0.75rem 1rem;
    text-align: left; border-bottom: 1px solid #333; white-space: nowrap;
  }
  td {
    padding: 0.6rem 1rem; border-bottom: 1px solid #1a1a2e;
    vertical-align: middle;
  }
  tr:hover td { background: #16213e; }
  .td-img img { width: 40px; height: 53px; object-fit: cover; border-radius: 4px; background: #111; }
  .td-name { max-width: 220px; }
  .td-name small { color: #888; display: block; }
  .td-price { color: #e8b84b; white-space: nowrap; }
  .td-stock { text-align: center; }
  .td-actions { white-space: nowrap; display: flex; gap: 0.4rem; }
  .category-badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px;
    background: #2a2a4a; font-size: 0.75rem; color: #aaa; white-space: nowrap;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 1rem;
  }
  .modal { display: none; }
  .modal.open { display: flex; }
  .modal-box {
    background: #16213e; border: 1px solid #e8b84b; border-radius: 12px;
    width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    padding: 2rem;
  }
  .modal-box h2 { color: #e8b84b; margin-bottom: 1.5rem; font-size: 1.2rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 0.4rem; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 0.6rem 0.9rem; border-radius: 8px;
    border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 0.9rem;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #e8b84b;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
  .img-preview {
    width: 60px; height: 80px; object-fit: cover; border-radius: 4px;
    background: #111; border: 1px solid #333; margin-top: 0.4rem;
    display: none;
  }

  /* Confirm modal */
  .confirm-box {
    background: #16213e; border: 1px solid #ff4444; border-radius: 12px;
    width: 100%; max-width: 400px; padding: 2rem; text-align: center;
  }
  .confirm-box h2 { color: #ff6060; margin-bottom: 1rem; }
  .confirm-box p { color: #ccc; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .confirm-actions { display: flex; gap: 0.75rem; justify-content: center; }

  /* Toast */
  #toast {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;
    background: #1a1a2e; border: 1px solid #e8b84b; border-radius: 8px;
    padding: 0.8rem 1.4rem; font-size: 0.9rem; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: #ff4444; color: #ff6060; }
  #toast.success { border-color: #00cc66; color: #00cc66; }

  .saving-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000; display: none;
  }
  .saving-box { background: #16213e; border: 1px solid #e8b84b; border-radius: 12px; padding: 2rem 3rem; text-align: center; color: #e8b84b; font-size: 1.1rem; }

  /* ── 送料計算タブ ── */
  .sc-wrap { max-width: 640px; }
  .sc-form { background: #111827; border: 1px solid #2a2a4a; border-radius: 10px; padding: 1.2rem; margin-bottom: 1rem; }
  .sc-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .sc-field { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 160px; }
  .sc-label { color: #888; font-size: 0.82rem; }
  .sc-select, .sc-input {
    padding: 0.5rem 0.8rem; border-radius: 8px; border: 1px solid #333;
    background: #0f0f1a; color: #fff; font-size: 0.92rem;
  }
  .sc-select:focus, .sc-input:focus { outline: none; border-color: #e8b84b; }
  .sc-input { width: 140px; }
  .sc-mode-toggle { display: flex; gap: 1.5rem; margin-bottom: 1rem; }
  .sc-mode-label { color: #aaa; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
  .sc-mode-label input { accent-color: #e8b84b; }
  .sc-box-row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .sc-box-select { padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 0.85rem; }
  .sc-box-qty { width: 70px; padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 0.85rem; }
  .sc-result-box { background: #111827; border: 1px solid #2a2a4a; border-radius: 10px; padding: 1.2rem; }
  .sc-result-title { color: #888; font-size: 0.78rem; margin-bottom: 0.8rem; }
  .sc-carrier-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid #1a1a2e; }
  .sc-carrier-row:last-child { border-bottom: none; }
  .sc-carrier-name { font-size: 0.88rem; color: #ccc; }
  .sc-carrier-price { font-size: 1.1rem; font-weight: bold; color: #e8b84b; }
  .sc-carrier-price.best { color: #00cc66; font-size: 1.2rem; }
  .sc-carrier-badge { font-size: 0.7rem; padding: 0.15rem 0.45rem; border-radius: 8px; margin-left: 0.4rem; background: #1a3a2a; color: #00cc66; }
  .sc-fuel-note { color: #666; font-size: 0.75rem; margin-top: 0.6rem; }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex; gap: 0; border-bottom: 2px solid #2a2d3e;
    margin-bottom: 1.5rem;
  }
  .tab-btn {
    padding: 0.65rem 1.6rem; border: none; cursor: pointer;
    background: transparent; color: #6b7280; font-size: 0.95rem;
    font-weight: 600; border-bottom: 3px solid transparent;
    margin-bottom: -2px; transition: all 0.2s; letter-spacing: 0.02em;
  }
  .tab-btn.active { color: #e8b84b; border-bottom-color: #e8b84b; }
  .tab-btn:hover:not(.active) { color: #d1d5db; }

  /* ── Messenger redesign ── */
  .ms-layout {
    display: flex; height: calc(100vh - 180px); margin-top: 0.5rem;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border: 1px solid #2a2d3e;
  }
  .ms-sidebar {
    width: 280px; min-width: 280px;
    background: #1e2235;
    display: flex; flex-direction: column;
  }
  .ms-sidebar-header {
    padding: 1rem; border-bottom: 1px solid #2a2d3e;
    display: flex; gap: 0.5rem; align-items: center;
    background: #252840;
  }
  .ms-search-input {
    flex: 1; padding: 0.45rem 0.8rem; border-radius: 20px;
    border: 1px solid #3a3d52; background: #1a1d2e;
    color: #e2e8f0; font-size: 0.85rem; outline: none;
    transition: border-color 0.2s;
  }
  .ms-search-input:focus { border-color: #7c6af7; }
  .ms-add-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #e8b84b, #f59e0b);
    color: #000; font-size: 1.1rem; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform 0.2s, opacity 0.2s;
  }
  .ms-add-btn:hover { transform: scale(1.1); }
  .ms-customer-list { overflow-y: auto; flex: 1; }
  .ms-customer-item {
    padding: 0.75rem 1rem; cursor: pointer;
    display: flex; align-items: center; gap: 0.75rem;
    border-bottom: 1px solid #252840; transition: background 0.15s;
    position: relative;
  }
  .ms-customer-item:hover { background: #252840; }
  .ms-customer-item.active { background: #2d3158; }
  .ms-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 1rem; color: #fff;
  }
  .ms-avatar.whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); }
  .ms-avatar.discord { background: linear-gradient(135deg, #5865f2, #3f51b5); }
  .ms-avatar.instagram { background: linear-gradient(135deg, #e1306c, #833ab4); }
  .ms-avatar.default { background: linear-gradient(135deg, #6b7280, #4b5563); }
  .ms-customer-info { flex: 1; min-width: 0; }
  .ms-customer-name {
    font-weight: 600; font-size: 0.9rem; color: #e2e8f0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ms-customer-platform { font-size: 0.75rem; color: #6b7280; margin-top: 0.1rem; }
  .ms-unread-badge {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff; border-radius: 12px; padding: 0.15rem 0.5rem;
    font-size: 0.72rem; font-weight: bold; flex-shrink: 0;
  }
  .ms-chat-area {
    flex: 1; display: flex; flex-direction: column;
    background: #161929;
  }
  .ms-chat-header {
    padding: 0.9rem 1.4rem; border-bottom: 1px solid #2a2d3e;
    background: #1e2235;
    display: flex; align-items: center; gap: 1rem;
  }
  .ms-chat-header-name {
    font-weight: 700; font-size: 1.05rem; color: #f1f5f9; flex: 1;
  }
  .ms-chat-header-platform {
    font-size: 0.78rem; color: #7c6af7;
    background: rgba(124,106,247,0.15); padding: 0.2rem 0.6rem;
    border-radius: 10px;
  }
  .ms-tag-input {
    padding: 0.35rem 0.7rem; border-radius: 8px; font-size: 0.8rem;
    border: 1px solid #3a3d52; background: #1a1d2e; color: #e2e8f0;
    width: 160px; outline: none; transition: border-color 0.2s;
  }
  .ms-tag-input:focus { border-color: #7c6af7; }
  .ms-save-btn {
    padding: 0.3rem 0.8rem; border-radius: 8px; font-size: 0.8rem;
    border: none; background: #3a3d52; color: #e2e8f0; cursor: pointer;
    transition: background 0.2s;
  }
  .ms-save-btn:hover { background: #4a4d62; }
  .ms-messages { flex: 1; overflow-y: auto; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
  .ms-msg {
    max-width: 70%; display: flex; flex-direction: column; gap: 0.25rem;
  }
  .ms-msg.from-me { align-self: flex-end; align-items: flex-end; }
  .ms-msg.from-customer { align-self: flex-start; align-items: flex-start; }
  .ms-bubble {
    padding: 0.65rem 1rem; border-radius: 16px; font-size: 0.9rem;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .ms-msg.from-me .ms-bubble {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .ms-msg.from-customer .ms-bubble {
    background: #252840; color: #e2e8f0; border-bottom-left-radius: 4px;
    border: 1px solid #2a2d3e;
  }
  .ms-translation {
    font-size: 0.75rem; color: #6b7280; padding: 0 0.2rem;
  }
  .ms-timestamp { font-size: 0.7rem; color: #4b5563; }
  .ms-suggestions-bar {
    padding: 0.6rem 1rem; border-top: 1px solid #2a2d3e;
    display: none; flex-wrap: wrap; gap: 0.5rem;
    background: #1e2235;
  }
  .ms-suggestion-btn {
    padding: 0.4rem 0.9rem; border-radius: 20px; border: none; cursor: pointer;
    font-size: 0.82rem; font-weight: 500; transition: all 0.2s;
    text-align: left; max-width: 100%;
  }
  .ms-suggestion-btn:nth-child(3n+1) { background: rgba(79,70,229,0.2); color: #a5b4fc; border: 1px solid rgba(79,70,229,0.4); }
  .ms-suggestion-btn:nth-child(3n+2) { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
  .ms-suggestion-btn:nth-child(3n+3) { background: rgba(232,184,75,0.2); color: #fde68a; border: 1px solid rgba(232,184,75,0.4); }
  .ms-suggestion-btn:hover { filter: brightness(1.3); transform: translateY(-1px); }
  .ms-input-area {
    padding: 0.8rem 1rem; border-top: 1px solid #2a2d3e;
    display: flex; gap: 0.6rem; align-items: flex-end;
    background: #1e2235;
  }
  .ms-reply-textarea {
    flex: 1; padding: 0.65rem 1rem; border-radius: 12px;
    border: 1px solid #3a3d52; background: #252840;
    color: #e2e8f0; font-size: 0.9rem; resize: none;
    font-family: inherit; outline: none; transition: border-color 0.2s;
    line-height: 1.4;
  }
  .ms-reply-textarea:focus { border-color: #7c6af7; }
  .ms-ai-btn {
    padding: 0.5rem 0.8rem; border-radius: 10px; border: 1px solid rgba(124,106,247,0.4);
    background: rgba(124,106,247,0.15); color: #a5b4fc;
    cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: all 0.2s;
    white-space: nowrap;
  }
  .ms-ai-btn:hover { background: rgba(124,106,247,0.3); }
  .ms-send-btn {
    padding: 0.6rem 1.2rem; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff; cursor: pointer; font-size: 0.9rem;
    font-weight: 600; transition: all 0.2s; white-space: nowrap;
  }
  .ms-send-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .ms-note-area {
    padding: 0.5rem 1rem; border-top: 1px solid #2a2d3e;
    display: flex; gap: 0.5rem; background: #1a1d2e;
  }
  .ms-note-input {
    flex: 1; padding: 0.35rem 0.7rem; border-radius: 8px;
    border: 1px solid #2a2d3e; background: transparent;
    color: #6b7280; font-size: 0.8rem; outline: none;
    transition: border-color 0.2s;
  }
  .ms-note-input:focus { border-color: #4a4d62; color: #9ca3af; }

  /* ── LINE取込 UI ── */
  #tab-line { display: none; }
  .line-textarea {
    width: 100%; min-height: 260px; padding: 1rem;
    border-radius: 8px; border: 1px solid #333;
    background: #0f0f1a; color: #fff; font-size: 0.88rem;
    font-family: 'Segoe UI', sans-serif; resize: vertical;
    line-height: 1.6;
  }
  .line-textarea:focus { outline: none; border-color: #e8b84b; }
  .line-controls { display: flex; gap: 0.75rem; align-items: center; margin: 0.75rem 0 1.5rem; }
  .parse-summary { color: #aaa; font-size: 0.85rem; }

  /* preview cards */
  .line-preview-cards { display: flex; flex-direction: column; gap: 0.6rem; }
  .lp-card {
    background: #111827; border: 1px solid #2a2a4a; border-radius: 12px;
    padding: 0.9rem 1rem; display: grid;
    grid-template-columns: auto 1fr auto; gap: 0.75rem; align-items: start;
    transition: border-color 0.15s;
  }
  .lp-card.is-matched { border-color: #1a3a2a; }
  .lp-card.is-unmatched { border-color: #3a1a1a; }
  .lp-card.is-checked { border-color: #4f46e5; background: #111827; }
  .lp-card-check { padding-top: 0.15rem; }
  .lp-card-check input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  .lp-card-body { min-width: 0; }
  .lp-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; min-width: 160px; }

  /* 商品名行 */
  .lp-name { font-size: 0.92rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .lp-match-name { font-size: 0.76rem; color: #888; margin-top: 0.15rem; line-height: 1.4; }
  .shrink-badge { font-size: 0.68rem; padding: 0.1rem 0.45rem; border-radius: 8px; background: #1a2a3a; color: #6ab; }
  .shrink-badge.no-shrink { background: #2a1a1a; color: #f86; }

  /* カテゴリ・ステータス行 */
  .lp-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .match-badge { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 10px; font-size: 0.72rem; font-weight: bold; }
  .badge-ok { background: #0d3d1f; color: #00cc66; }
  .badge-new { background: #3d2a0d; color: #ffa040; }
  .badge-skip { background: #2a2a2a; color: #666; }
  .category-badge { font-size: 0.72rem; padding: 0.15rem 0.55rem; border-radius: 10px; background: #1a1a3a; color: #aaa; }
  .cat-select-inline { padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 0.78rem; max-width: 200px; }

  /* 価格変化表示 */
  .lp-price-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .price-old { color: #666; text-decoration: line-through; font-size: 0.82rem; }
  .price-arrow { color: #555; font-size: 0.8rem; }
  .price-new { color: #e8b84b; font-weight: bold; font-size: 1rem; }
  .price-same { color: #888; font-size: 0.9rem; }
  .price-qty { font-size: 0.75rem; color: #a78bfa; margin-left: 0.2rem; }

  /* 業者価格ピル */
  .sup-prices { display: flex; flex-direction: column; gap: 0.35rem; width: 100%; }
  .sup-pill {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.35rem 0.65rem; border-radius: 8px; border: 1px solid #2a2a4a;
    background: #0f0f1a; cursor: pointer; transition: all 0.15s; gap: 0.5rem;
    font-size: 0.82rem;
  }
  .sup-pill:hover { border-color: #4f46e5; }

<script>
const PASS_HASH = 'b39740eeb5031933ad3b11d95303512c86fe8291c24a7d51e4ea9670d66c94a5';
const REPO = 'kyosuke-takei/pricelist';
const FILE_PATH = 'data.json';

let data = [];
let editTarget = null;
let currentPage = 1;
const PAGE_SIZE = 50;
let debounceTimer = null;

// ── Auth ──────────────────────────────────────────
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function doLogin() {
  const pw = document.getElementById('password-input').value;
  const hash = await sha256(pw);
  if (hash === PASS_HASH) {
    sessionStorage.setItem('admin', '1');
    showAdmin();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('password-input').value = '';
  }
}

document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogout() {
  sessionStorage.removeItem('admin');
  location.reload();
}

// ── Token ──────────────────────────────────────────
function saveToken() {
  const t = document.getElementById('gh-token').value.trim();
  if (t) localStorage.setItem('gh_token', t);
  document.getElementById('token-status').textContent = t ? '✓ 設定済' : '';
  document.getElementById('token-status').className = 'token-status ' + (t ? 'token-ok' : '');
}

function loadToken() {
  const t = localStorage.getItem('gh_token') || '';
  if (t) {
    document.getElementById('gh-token').value = t;
    document.getElementById('token-status').textContent = '✓ 設定済';
    document.getElementById('token-status').className = 'token-status token-ok';
  }
}

// ── Init ──────────────────────────────────────────
async function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  loadToken();
  const savedEnable = localStorage.getItem('discord_notify_enable') === 'true';
  const enEl = document.getElementById('discord-notify-enable');
  if (enEl) enEl.checked = savedEnable;
  await loadData();
  // 燃油サーチャージ読み込み
  try { const r = await fetch('fuel_cache.json'); const d = await r.json(); window._scFuelRate = d.rate / 100; } catch { window._scFuelRate = 0.48; }
  try { const r = await fetch('fedex_fuel_cache.json'); const d = await r.json(); window._scFedexFuelRate = d.rate; } catch { window._scFedexFuelRate = 45.5; }
}

async function loadData() {
  try {
    const res = await fetch(`data.json?_=${Date.now()}`);
    data = await res.json();
    refreshCategoryFilter();
    renderTable();
  } catch (e) {
    showToast('data.json の読み込みに失敗しました', 'error');
  }
}

// ── Category helpers ──────────────────────────────
function getCategories() {
  return data.map(g => g.label);
}

function refreshCategoryFilter() {
  const sel = document.getElementById('filter-cat');
  const current = sel.value;
  sel.innerHTML = '<option value="">全カテゴリ</option>';
  getCategories().forEach(label => {
    const opt = document.createElement('option');
    opt.value = label;
    opt.textContent = label;
    sel.appendChild(opt);
  });
  if (current) sel.value = current;
}

function refreshCategorySelect(selectedLabel) {
  const sel = document.getElementById('f-category');
  sel.innerHTML = '';
  getCategories().forEach(label => {
    const opt = document.createElement('option');

// ── Table ──────────────────────────────────────────
function debounceRender() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { currentPage = 1; renderTable(); }, 200);
}

function resetAndRender() {
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const catFilter = document.getElementById('filter-cat').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  // フィルタ済みの全アイテムをフラットリストに
  const filtered = [];
  data.forEach((group, catIdx) => {
    if (catFilter && group.label !== catFilter) return;
    group.items.forEach((item, itemIdx) => {
      const name = (item.name || '') + (item.nameEn || '');
      if (search && !name.toLowerCase().includes(search)) return;
      filtered.push({ group, catIdx, item, itemIdx });
    });
  });

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  pageItems.forEach(({ group, catIdx, item, itemIdx }) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-img"><img src="${item.img || ''}" alt="" loading="lazy" onerror="this.style.display='none'"></td>
      <td class="td-name">
        <div>${escHtml(item.name || '')}</div>
        <small>${escHtml(item.nameEn || '')}</small>
      </td>
      <td><span class="category-badge">${escHtml(group.label)}</span></td>
      <td class="td-price">
        ${escHtml(item.price || '')}
        ${item.priceDate ? `<div style="font-size:0.7rem;color:#888;margin-top:2px">${item.priceDate}</div>` : ''}
      </td>
      <td class="td-stock">${item.stock ?? '-'}</td>
      <td class="td-actions">
        <button class="btn btn-secondary btn-sm" onclick="openEditModal(${catIdx},${itemIdx})">編集</button>
        <button class="btn btn-danger btn-sm" onclick="openDeleteConfirm(${catIdx},${itemIdx})">削除</button>
      </td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('item-count').textContent = `${total} 件`;
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (totalPages <= 1) return;

  const btnStyle = 'padding:0.4rem 0.8rem;border-radius:6px;border:1px solid #333;background:#1a1a2e;color:#fff;cursor:pointer;font-size:0.85rem;';
  const activStyle = 'padding:0.4rem 0.8rem;border-radius:6px;border:1px solid #e8b84b;background:#e8b84b;color:#000;cursor:pointer;font-size:0.85rem;font-weight:bold;';

  const addBtn = (label, page, disabled) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = page === currentPage ? activStyle : btnStyle;
    if (disabled) { b.disabled = true; b.style.opacity = '0.4'; }
    b.onclick = () => { currentPage = page; renderTable(); window.scrollTo(0,0); };
    pg.appendChild(b);
  };

  addBtn('«', 1, currentPage === 1);
  addBtn('‹', currentPage - 1, currentPage === 1);

  // 前後2ページを表示
  for (let p = Math.max(1, currentPage - 2); p <= Math.min(totalPages, currentPage + 2); p++) {
    addBtn(p, p, false);
  }

  addBtn('›', currentPage + 1, currentPage === totalPages);
  addBtn('»', totalPages, currentPage === totalPages);

  const info = document.createElement('span');
  info.textContent = `${currentPage} / ${totalPages} ページ`;
  info.style.cssText = 'color:#888;font-size:0.8rem;';
  pg.appendChild(info);
}

    preview.style.display = 'block';
    preview.onerror = () => { preview.style.display = 'none'; };
  } else {

  }
}

async function saveItem() {
  const catSel = document.getElementById('f-category').value;
  const isNewCat = catSel === '__new__';
  const newCatName = document.getElementById('f-new-category').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const price = document.getElementById('f-price').value.trim();

  if (!name) { showToast('商品名（日本語）は必須です', 'error'); return; }
  if (!price) { showToast('価格は必須です', 'error'); return; }
  if (isNewCat && !newCatName) { showToast('新規カテゴリ名を入力してください', 'error'); return; }

  const catLabel = isNewCat ? newCatName : catSel;

  const item = {
    name,
    nameEn: document.getElementById('f-nameEn').value.trim() || undefined,
    price,
    stock: document.getElementById('f-stock').value !== '' ? parseInt(document.getElementById('f-stock').value) : undefined,
    img: document.getElementById('f-img').value.trim() || undefined,
    link: document.getElementById('f-link').value.trim() || undefined,
    modelNum: document.getElementById('f-modelNum').value.trim() || undefined,
  };
  // undefinedキーを除去
  Object.keys(item).forEach(k => item[k] === undefined && delete item[k]);

  const newData = JSON.parse(JSON.stringify(data));

  if (editTarget) {
    const { catIdx, itemIdx } = editTarget;
    const oldLabel = newData[catIdx].label;
    if (oldLabel !== catLabel) {
      // カテゴリ変更: 元から削除して新しいカテゴリへ
      newData[catIdx].items.splice(itemIdx, 1);
      if (newData[catIdx].items.length === 0) newData.splice(catIdx, 1);
      addItemToCategory(newData, catLabel, item);
    } else {
      newData[catIdx].items[itemIdx] = item;
    }
  } else {
    addItemToCategory(newData, catLabel, item);
  }

  await commitData(newData);
}

function addItemToCategory(newData, catLabel, item) {
  const catIdx = newData.findIndex(g => g.label === catLabel);
  if (catIdx >= 0) {
    newData[catIdx].items.push(item);
  } else {
    newData.push({ label: catLabel, items: [item] });
  }
}

// ── Delete ──────────────────────────────────────────
function openDeleteConfirm(catIdx, itemIdx) {
  const item = data[catIdx].items[itemIdx];
  document.getElementById('confirm-msg').textContent = `「${item.name}」を削除しますか？`;
  const btn = document.getElementById('confirm-ok-btn');
  btn.onclick = async () => {
    closeModal('confirm-modal');
    const newData = JSON.parse(JSON.stringify(data));
    newData[catIdx].items.splice(itemIdx, 1);
    if (newData[catIdx].items.length === 0) newData.splice(catIdx, 1);
    await commitData(newData);
  };
  openModal('confirm-modal');
}

// ── GitHub API ──────────────────────────────────────
async function commitData(newData) {
  const token = (document.getElementById('gh-token').value || localStorage.getItem('gh_token') || '').trim();
  if (!token) {
    showToast('GitHub Tokenを入力してください', 'error');
    return;
  }

  showSaving(true);
  try {
    // 現在のファイルのSHAを取得
    const metaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!metaRes.ok) throw new Error(`GitHub API error: ${metaRes.status}`);
    const meta = await metaRes.json();

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
    const updateRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Admin: ${editTarget ? '商品更新' : '商品追加'} - ${new Date().toLocaleString('ja-JP')}`,
        content,
        sha: meta.sha
      })
    });

    if (!updateRes.ok) {
      const err = await updateRes.json();
      throw new Error(err.message || updateRes.status);
    }

    data = newData;
    refreshCategoryFilter();
    renderTable();
    closeModal('edit-modal');
    showToast('GitHubに保存しました ✓', 'success');
  } catch (e) {
    showToast('保存失敗: ' + e.message, 'error');
  } finally {
    showSaving(false);
  }
}

// ── メッセンジャー ─────────────────────────────────
const MS_API = 'http://localhost:3210/api';
let msCustomers = [];
let msCurrentCustomer = null;
let msWs = null;
let msInited = false;

const platformIcon = { discord: '🎮', whatsapp: '💬', messenger: '💬', instagram: '📸', facebook: '👤', manual: '📝' };

function msInit() {
  if (msInited) return;
  msInited = true;
  msLoadCustomers();
  msConnectWs();
  if (Notification.permission === 'default') Notification.requestPermission();
}

function msNotify(customerName, text) {
  if (Notification.permission !== 'granted') return;
  const n = new Notification(`💬 ${customerName}`, { body: text, icon: '/favicon.ico' });
  n.onclick = () => { window.focus(); n.close(); };
  setTimeout(() => n.close(), 6000);
}

function msConnectWs() {
  try {
    msWs = new WebSocket('ws://localhost:3210');
    msWs.onmessage = (e) => {
      const { event, payload } = JSON.parse(e.data);
      if (event === 'new_message') {
        const { customerId, customer, message, suggestions } = payload;
        if (customer) {
          const idx = msCustomers.findIndex(c => c.id === customerId);
          if (idx >= 0) msCustomers[idx] = customer;
          else msCustomers.unshift(customer);
        }
        if (msCurrentCustomer?.id === customerId) {
          msAppendMessage(message);
          if (suggestions?.length) msShowSuggestions(suggestions);
          fetch(`${MS_API}/customers/${customerId}/read`, { method: 'POST' });
        } else {
          const c = msCustomers.find(c => c.id === customerId);
          if (c) c.unread = (c.unread || 0) + 1;
          msUpdateBadge();
          const name = customer?.name || customerId;
          msNotify(name, message.text.slice(0, 80));
        }
        msRenderCustomerList();
      } else if (event === 'customer_added') {
        msCustomers.unshift(payload);
        msRenderCustomerList();
      }
    };
    msWs.onclose = () => setTimeout(msConnectWs, 3000);
  } catch {}
}

async function msLoadCustomers() {
  try {
    const r = await fetch(`${MS_API}/customers`);
    msCustomers = await r.json();
    msRenderCustomerList();
    msUpdateBadge();
  } catch {
    document.getElementById('ms-customer-list').innerHTML =
      '<div style="padding:1rem;color:#ff6060;font-size:0.85rem">⚠️ サーバー未起動<br><code>node messenger-server.js</code><br>を実行してください</div>';
  }
}

function msRenderCustomerList() {
  const q = document.getElementById('ms-search')?.value.toLowerCase() || '';
  const list = msCustomers.filter(c => c.name.toLowerCase().includes(q));
  const el = document.getElementById('ms-customer-list');
  const platClass = { discord: 'discord', whatsapp: 'whatsapp', instagram: 'instagram' };
  el.innerHTML = list.map(c => `
    <div onclick="msSelectCustomer('${c.id}')" class="ms-customer-item${msCurrentCustomer?.id === c.id ? ' active' : ''}">
      <div class="ms-avatar ${platClass[c.platform] || 'default'}">${c.name.charAt(0).toUpperCase()}</div>
      <div class="ms-customer-info">
        <div class="ms-customer-name">${escHtml(c.name)}</div>
        <div class="ms-customer-platform">${platformIcon[c.platform] || '💬'} ${c.platform}${c.tags?.length ? ' · ' + c.tags.join(', ') : ''}</div>
      </div>
      ${c.unread > 0 ? `<span class="ms-unread-badge">${c.unread}</span>` : ''}
    </div>
  `).join('') || '<div style="padding:1.5rem;color:#6b7280;font-size:0.85rem;text-align:center">顧客がいません</div>';
}

function msUpdateBadge() {
  const total = msCustomers.reduce((s, c) => s + (c.unread || 0), 0);
  const badge = document.getElementById('messenger-badge');
  badge.style.display = total > 0 ? 'inline' : 'none';
  badge.textContent = total;
}

async function msSelectCustomer(id) {
  msCurrentCustomer = msCustomers.find(c => c.id === id);
  if (!msCurrentCustomer) return;

  // ヘッダー更新
  document.getElementById('ms-header-name').textContent = msCurrentCustomer.name;
  const pEl = document.getElementById('ms-header-platform');
  pEl.textContent = platformIcon[msCurrentCustomer.platform] + ' ' + msCurrentCustomer.platform;
  pEl.style.display = 'inline-block';
  document.getElementById('ms-tag-input').value = (msCurrentCustomer.tags || []).join(', ');
  document.getElementById('ms-note-input').value = msCurrentCustomer.note || '';

  // メッセージ読み込み
  const r = await fetch(`${MS_API}/messages/${id}`);
  const msgs = await r.json();
  const el = document.getElementById('ms-messages');
  el.innerHTML = '';
  msgs.forEach(m => msAppendMessage(m));
  el.scrollTop = el.scrollHeight;

  // 既読
  fetch(`${MS_API}/customers/${id}/read`, { method: 'POST' });
  msCurrentCustomer.unread = 0;
  msUpdateBadge();
  msRenderCustomerList();
}

function msAppendMessage(msg) {
  const el = document.getElementById('ms-messages');
  const isMe = msg.from === 'me';
  const div = document.createElement('div');
  div.className = `ms-msg ${isMe ? 'from-me' : 'from-customer'}`;
  div.innerHTML = `
    <div class="ms-bubble">${escHtml(msg.text)}</div>
    ${!isMe && msg.translation ? `<div class="ms-translation">🇯🇵 ${escHtml(msg.translation)}</div>` : ''}
    <div class="ms-timestamp">${new Date(msg.timestamp).toLocaleString('ja-JP')}</div>
  `;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

async function msGetSuggestions() {
  if (!msCurrentCustomer) { showToast('顧客を選択してください', 'error'); return; }
  const btn = document.querySelector('.ms-ai-btn');
  if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }
  try {
    const r = await fetch(`${MS_API}/suggest/${msCurrentCustomer.id}`, { method: 'POST' });
    if (!r.ok) { showToast('AIエラー: ' + r.status, 'error'); return; }
    const { suggestions } = await r.json();
    if (!suggestions?.length) { showToast('返信案を生成できませんでした', 'error'); return; }
    msShowSuggestions(suggestions);
  } catch(e) {
    showToast('AI案エラー: ' + e.message, 'error');
  } finally {
    if (btn) { btn.textContent = '💡 AI案'; btn.disabled = false; }
  }
}

function msShowSuggestions(suggestions) {
  const el = document.getElementById('ms-suggestions');
  if (!suggestions?.length) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.style.flexWrap = 'wrap';
  el.innerHTML = suggestions.map(s => {
    const text = (typeof s === 'string' ? s : s.en) || '';
    const ja = (typeof s === 'object' ? s.ja : '') || '';
    if (!text) return '';
    return `
    <button onclick="document.getElementById('ms-reply-input').value=this.dataset.text" data-text="${text.replace(/"/g, '&quot;')}" class="ms-suggestion-btn">
      <div>${escHtml(text)}</div>
      ${ja ? `<div style="opacity:0.7;font-size:0.75rem;margin-top:2px">🇯🇵 ${escHtml(ja)}</div>` : ''}
    </button>`;
  }).join('');
}

async function msSendReply() {
  const text = document.getElementById('ms-reply-input').value.trim();
  if (!text || !msCurrentCustomer) return;

  if (msCurrentCustomer.platform === 'discord' && msCurrentCustomer.id.startsWith('discord_')) {
    // Discord返信
    const lastMsg = (await (await fetch(`${MS_API}/messages/${msCurrentCustomer.id}`)).json()).filter(m => m.channelId).pop();
    if (!lastMsg?.channelId) { alert('チャンネルIDが不明です'); return; }
    await fetch(`${MS_API}/reply/discord`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channelId: lastMsg.channelId, text, customerId: msCurrentCustomer.id })
    });
  } else if (msCurrentCustomer.platform === 'whatsapp') {
    // WhatsApp返信
    const waId = msCurrentCustomer.id.replace('whatsapp_', '');
    await fetch(`${MS_API}/reply/whatsapp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ waId, text, customerId: msCurrentCustomer.id })
    });
  } else if (msCurrentCustomer.platform === 'messenger') {
    // Messenger返信
    const senderId = msCurrentCustomer.id.replace('messenger_', '');
    await fetch(`${MS_API}/reply/messenger`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senderId, text, customerId: msCurrentCustomer.id })
    });
  } else {
    // 手動記録
    await fetch(`${MS_API}/messages/${msCurrentCustomer.id}/manual`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, from: 'me', platform: msCurrentCustomer.platform })
    });
  }
  document.getElementById('ms-reply-input').value = '';
}

async function msSaveTags() {
  if (!msCurrentCustomer) return;
  const tags = document.getElementById('ms-tag-input').value.split(',').map(t => t.trim()).filter(Boolean);
  await fetch(`${MS_API}/customers/${msCurrentCustomer.id}/update`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tags })
  });
  msCurrentCustomer.tags = tags;
  msRenderCustomerList();
}

async function msSaveNote() {
  if (!msCurrentCustomer) return;
  const note = document.getElementById('ms-note-input').value;
  await fetch(`${MS_API}/customers/${msCurrentCustomer.id}/update`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ note })
  });
}

function msFilterCustomers() { msRenderCustomerList(); }

function msOpenAddCustomer() { document.getElementById('ms-add-modal').style.display = 'flex'; }

async function msAddCustomer() {
  const name = document.getElementById('ms-add-name').value.trim();
  const platform = document.getElementById('ms-add-platform').value;
  const note = document.getElementById('ms-add-note').value.trim();
  if (!name) return;

  document.getElementById('ms-add-modal').style.display = 'none';
  document.getElementById('ms-add-name').value = '';
  msLoadCustomers();
}

});

  document.getElementById('supplier-blocks').appendChild(div);
}

// ── グループチャット自動分割 ──────────────────────
function toggleAutosplit() {
  const sec = document.getElementById('autosplit-section');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
}

// "名前 — 時刻" パターンでLINEグループチャットを分割
function autoSplitText(fullText) {
  // 送信者行: テキスト — (昨日/今日/HH:MM)
  const senderRe = /^(.+?)\s+[—–]\s+(昨日|今日|\d{1,2}:\d{2})/;
  const lines = fullText.split('\n');
  const segments = []; // 時系列順（古い→新しい）
  let curName = null, curLines = [];

  for (const line of lines) {
    const m = senderRe.exec(line.trim());
    if (m) {
      if (curName !== null && curLines.join('\n').trim()) {
        segments.push({ name: cleanSenderName(curName), text: curLines.join('\n') });
      }
      curName = m[1].trim();
      curLines = [];
    } else {
      curLines.push(line);
    }
  }
  if (curName !== null && curLines.join('\n').trim()) {
    segments.push({ name: cleanSenderName(curName), text: curLines.join('\n') });
  }

  // 同じ送信者が複数回投稿している場合、最新（最後）の投稿を使う
  // ただし〆・売り切れのみの投稿は価格情報がないのでスキップ
  const isSoldOutOnly = (text) => {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    return lines.every(l => /^(〆|締|完売|売り切れ|SOLD OUT|sold out|完売中|在庫なし)/i.test(l) || l.length < 5);
  };

  const latestMap = new Map(); // name → index in segments
  segments.forEach((seg, idx) => {
    if (!isSoldOutOnly(seg.text)) {
      latestMap.set(seg.name, idx);
    }
  });

  // latestMapに含まれるindexのセグメントのみ、重複なく返す（順序は最初の登場順）
  const seen = new Set();
  const result = [];
  for (const [name, latestIdx] of latestMap) {
    if (!seen.has(name)) {
      seen.add(name);
      result.push(segments[latestIdx]);
    }
  }
  return result;
}

function cleanSenderName(raw) {
  const cleaned = raw
    .replace(/^【[^】]*】\s*/, '')      // 【5-1009】を除去
    .replace(/^\d[\d\-]*\s+/, '')       // 5-1089 などの番号を除去
    .replace(/^(合同会社|株式会社|有限会社)\s*/, '') // 会社形態を除去
    .replace(/（[^）]*）\s*$/, '')       // 末尾の（括弧）を除去
    .trim();
  return cleaned || raw.trim();
}

function autoSplitAndFill() {
  const text = document.getElementById('autosplit-input').value.trim();
  if (!text) { showToast('テキストを貼り付けてください', 'error'); return; }

  const segments = autoSplitText(text);
  if (!segments.length) {
    document.getElementById('autosplit-msg').textContent = '送信者を検出できませんでした。業者ブロックに手動で貼り付けてください';
    return;
  }

  // 既存ブロックをクリアして置き換え
  document.getElementById('supplier-blocks').innerHTML = '';
  supplierIdCounter = 0;
  segments.forEach(s => addSupplierBlock(s.name, s.text));

  showToast(`${segments.length} 業者を自動検出しました ✓`, 'success');
  document.getElementById('autosplit-section').style.display = 'none';
  document.getElementById('autosplit-input').value = '';
  document.getElementById('autosplit-msg').textContent = '';
}

// ── LINE取込: 各種価格行フォーマット対応 ──────────
function tryParsePriceLine(line) {
  let m;

  // 1. 標準: 21BOX@15,500円 / 3BOX@11,900円（シュリなし）
  m = /^(\d[\d,]*)\s*(BOX|box|ボックス|パック|pack)\s*[@＠]\s*([\d,]+)円?(.*)?$/i.exec(line);
  if (m) {
    const note = (m[4] || '').trim();
    const shrink = /シュリなし|シュリンクなし|シュリンク無し?|シュリ無|白箱/i.test(note) ? false : null;
    return { qty: +m[1].replace(/,/g,''), unit: 'BOX', price: +m[3].replace(/,/g,''), note, shrink, isCarton: false };
  }

  // 2. カートン: 1カートン@168,000円 / 4カートン　@ 165000円
  m = /^(\d[\d,]*)\s*カートン\s*[@＠]\s*([\d,]+)円?(.*)?$/.exec(line);
  if (m) return { qty: +m[1], unit: 'カートン', price: +m[2].replace(/,/g,''), note: (m[3]||'').trim(), shrink: null, isCarton: true };

  // 3. case: 2case＠70,000円 / 1case＠140,000円
  m = /^(\d[\d,]*)\s*[Cc]ase\s*[@＠]\s*([\d,]+)円?(.*)?$/i.exec(line);
  if (m) return { qty: +m[1], unit: 'case', price: +m[2].replace(/,/g,''), note: (m[3]||'').trim(), shrink: null, isCarton: true };

  // 4. HJC: @17,000円　×100BOX / @価格 ×N
  m = /^[@＠]\s*([\d,]+)円?\s*[×xX]\s*(\d+)\s*(BOX|box|パック|個)?/.exec(line);
  if (m) return { qty: +m[2], unit: 'BOX', price: +m[1].replace(/,/g,''), note: '', shrink: null, isCarton: false };

  // 5. 馬場和也: @15300円  在庫数400
  m = /^[@＠]\s*([\d,]+)円?\s+在庫数\s*(\d+)/.exec(line);
  if (m) return { qty: +m[2], unit: 'BOX', price: +m[1].replace(/,/g,''), note: '', shrink: null, isCarton: false };

  // 6. 馬場和也スタンドアロン: @15300円（数量なし → qty=1）
  m = /^[@＠]\s*([\d,]+)円?\s*$/.exec(line);
  if (m) return { qty: 1, unit: 'BOX', price: +m[1].replace(/,/g,''), note: '', shrink: null, isCarton: false };

  // 7. N&U逆順: 15500@30 / 15500@30BOX（価格≥1000 かつ 数量≤999）
  m = /^([\d,]+)\s*[@＠]\s*(\d+)\s*(?:BOX|box)?\s*$/.exec(line);
  if (m) {
    const price = +m[1].replace(/,/g,''), qty = +m[2];
    if (price >= 1000 && qty <= 999) return { qty, unit: 'BOX', price, note: '', shrink: null, isCarton: false };
  }

  // 8. N&Uカートン逆順: カートン435000@1
  m = /^カートン([\d,]+)\s*[@＠]\s*(\d+)/.exec(line);
  if (m) return { qty: +m[2], unit: 'カートン', price: +m[1].replace(/,/g,''), note: '', shrink: null, isCarton: true };

  // 9. スペース入り: 89box @ 15000円 / 100box @ 20500円
  m = /^(\d+)\s+box\s+[@＠]\s*([\d,]+)円?/i.exec(line);
  if (m) return { qty: +m[1], unit: 'BOX', price: +m[2].replace(/,/g,''), note: '', shrink: null, isCarton: false };

  // 10. ファインコ武: 174000円/ 1ケース
  m = /^([\d,]+)円\s*[\/／]\s*(\d+)\s*(ケース|カートン)/.exec(line);
  if (m) return { qty: +m[2], unit: m[3], price: +m[1].replace(/,/g,''), note: '', shrink: null, isCarton: true };

  return null;
}

// 商品名からシュリ情報を抽出
function extractShrinkFromName(name) {
  const re = /\s*(シュリなし|シュリンクなし|シュリンク無し?|シュリンク無|シュリ無|白箱)/i;
  if (re.test(name)) return { cleanName: name.replace(re, '').trim(), shrink: false };
  return { cleanName: name, shrink: true };
}

// 商品名っぽい行か判定（プレフィックスなし形式用）
function looksLikeProductName(line) {
  if (!line || line.length > 60) return false;
  if (/^\d/.test(line)) return false;                          // 数字始まり
  if (/^[◇◎⚠☆★♦]/.test(line)) return false;                  // 注釈記号
  if (/送料|発送|転送|適格|国内|着払|発払|買取|問合|◇|◎/.test(line)) return false;
  if (/円[\/／]/.test(line)) return false;
  return true;
}

// ── LINE取込: パーサー本体 ────────────────────────
function normalize(str) {
  return (str || '')
    .toLowerCase()
    .replace(/[　\s]/g, '')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[－ー]/g, '-')
    .replace(/[（(][^）)]*[）)]/g, '')
    // 英字↔カタカナ 表記ゆれ吸収
    .replace(/mega/g, 'メガ')
    .replace(/mini/g, 'ミニ')
    .replace(/super/g, 'スーパー')
    .replace(/ultra/g, 'ウルトラ');
}

function parseLineText(text) {
  const lines = text.split('\n').map(l => l.trim());
  const results = [];
  let currentName = null;
  let inDamageSection = false;

  // 名前プレフィックス（各種書き方に対応）
  const namePrefixRe = /^[☑✅・◆▶►▷◇●○■□★☆▢◉▼🌈]\s*[️\s]*/u;
  // 絵文字サンドイッチ → セクション見出し（スキップ）
  const sectionRe = /^\p{Emoji_Presentation}.*\p{Emoji_Presentation}\s*$/u;
  // ダメージ品セクション → 以降スキップ
  const damageSectionRe = /⚠.*ダメージ品/i;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line) continue;

    // ダメージセクション以降はスキップ
    if (damageSectionRe.test(line)) { inDamageSection = true; continue; }
    if (inDamageSection) continue;

    // セクション見出し → スキップ、名前リセット
    if (sectionRe.test(line)) { currentName = null; continue; }

    // 価格行か試みる
    const priceResult = tryParsePriceLine(line);
    if (priceResult && priceResult.price > 100) {
      if (currentName) {
        const { cleanName, shrink: nameShrink } = extractShrinkFromName(currentName);
        const shrink = priceResult.shrink !== null ? priceResult.shrink : nameShrink;
        results.push({ lineName: cleanName, qty: priceResult.qty, price: priceResult.price, shrink, isCarton: priceResult.isCarton, note: priceResult.note });
      }
      continue;
    }

    // 明示プレフィックス付き商品名
    if (namePrefixRe.test(line)) {
      currentName = line.replace(namePrefixRe, '').trim();
      continue;
    }

    // プレフィックスなし形式（次行が価格行なら商品名として採用）
    if (looksLikeProductName(line)) {
      const nextLine = lines.slice(i + 1).find(l => l.trim());
      if (nextLine) {
        const np = tryParsePriceLine(nextLine);
        if (np && np.price > 100) currentName = line;
      }
    }
  }
  return results;
}

// ── LINE取込: マッチング ──────────────────────────
function findMatch(lineName, shrink) {
  // スラッシュ区切りの場合は最初のトークンを使う（例: "MEGAドリームex / メガドリーム"）
  const primaryName = lineName.split(/[\/／]/).map(s => s.trim())[0];
  const needle = normalize(primaryName);
  const targetCats = shrink ? BOX_CATS_SHRINK : BOX_CATS_NOSHRINK;

  if (!needle || needle.length < 2) return null;

  let best = null;
  let bestScore = 0;

  const score = (item, catLabel) => {
    const fields = [item.name, item.nameJp, item.nameEn, item.nameShort].filter(Boolean).map(normalize);
    let s = 0;
    for (const f of fields) {
      if (!f) continue;

      // 完全一致
      if (f === needle) { s = Math.max(s, 2.0); continue; }

      // needle が f に含まれる（商品名がより長い場合）
      if (f.includes(needle)) {
        const overlap = needle.length / f.length;
        // 数字のみ（「151」など）は単語境界チェック
        if (/^\d+$/.test(needle)) {
          const wordMatch = new RegExp(`(?<![\\d])${needle}(?![\\d])`).test(f);
          if (wordMatch) s = Math.max(s, 0.8);
        } else {
          const penalty = needle.length <= 3 ? 0.6 : 1.0;
          s = Math.max(s, overlap * 1.2 * penalty);
        }
      }

      // f が needle に含まれる（商品名が省略形の場合）
      if (needle.includes(f) && f.length >= 4) {
        const overlap = f.length / needle.length;
        s = Math.max(s, overlap * 1.0);
      }
    }

    if (targetCats.includes(catLabel)) s += 0.1;
    if (BOX_CATS_ALL.includes(catLabel)) s += 0.05;
    return s;
  };

  data.forEach((group, catIdx) => {
    if (!BOX_CATS_ALL.includes(group.label)) return;
    group.items.forEach((item, itemIdx) => {
      const s = score(item, group.label);
      if (s > bestScore) { bestScore = s; best = { catIdx, itemIdx, score: s }; }
    });
  });

  return bestScore >= 0.3 ? best : null;
}

function formatPrice(yen) {
  return '¥' + yen.toLocaleString('ja-JP');
}

// ── LINE取込: 集約・比較グループ作成 ──────────────
let lineGroups = []; // 集約後のグループ

function buildGroups(suppliers) {
  // key → group
  const map = new Map();

  suppliers.forEach((sup, supIdx) => {
    const parsed = parseLineText(sup.text);
    parsed.forEach(p => {
      const match = findMatch(p.lineName, p.shrink);
      // グループキー: マッチあり→ catIdx:itemIdx、なし→ "u:正規化名"
      const key = match
        ? `m:${match.catIdx}:${match.itemIdx}`
        : `u:${normalize(p.lineName)}:${p.shrink ? '1' : '0'}`;

      if (!map.has(key)) {
        map.set(key, {
          key, lineName: p.lineName, match,
          shrink: p.shrink,
          supplierEntries: [], // { supIdx, name, qty, price, isCarton, note }
          checked: true,
          selectedPrice: null, // 適用する価格（後で決定）
          overrideCat: null,
        });
      }
      const g = map.get(key);
      // 同じ業者から複数ある場合もpush（カートンとBOXが混在するケース）
      g.supplierEntries.push({ supIdx, supName: sup.name, qty: p.qty, price: p.price, isCarton: p.isCarton, note: p.note });
      // BOX優先で lineName を上書き（より正確な名前が後に来る場合への対応）
      if (!p.isCarton) g.lineName = p.lineName;
    });
  });

  // 各グループのデフォルト適用価格を最安値BOXに設定
  map.forEach(g => {
    const boxEntries = g.supplierEntries.filter(e => !e.isCarton);
    const pool = boxEntries.length ? boxEntries : g.supplierEntries;
    const best = pool.reduce((a, b) => b.price > a.price ? b : a, pool[0]);
    g.selectedPrice = best ? best.price : 0;
    g.selectedQty = best ? best.qty : 0;
    g.selectedSupName = best ? best.supName : '';
  });

  return Array.from(map.values());
}

// ── LINE取込: AIパース ────────────────────────────
async function aiParseAndPreview() {
  const suppliers = getSuppliers();
  if (!suppliers.length) { showToast('テキストを貼り付けてください', 'error'); return; }

  const btn = document.getElementById('ai-parse-btn');
  btn.disabled = true;
  btn.textContent = '⏳ AI解析中...';

  try {
    // 各業者テキストをAIでパース
    const parsedSuppliers = await Promise.all(suppliers.map(async (sup) => {
      const res = await fetch('/api/parse-line', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: sup.text })
      });
      const json = await res.json();
      return { sup, items: json.items || [] };
    }));

    // buildGroups と同じ構造でグループを作成（AI結果を使用）
    const map = new Map();
    parsedSuppliers.forEach(({ sup, items }, supIdx) => {
      items.forEach(p => {
        const shrink = p.shrink !== undefined ? p.shrink : true;
        const match = findMatch(p.name, shrink);
        const key = match
          ? `m:${match.catIdx}:${match.itemIdx}`
          : `u:${normalize(p.name)}:${shrink ? '1' : '0'}`;

        if (!map.has(key)) {
          map.set(key, {
            key, lineName: p.name, match,
            shrink,
            supplierEntries: [],
            checked: true,
            selectedPrice: null,
            overrideCat: null,
          });
        }
        const g = map.get(key);
        g.supplierEntries.push({
          supIdx, supName: sup.name,
          qty: p.qty || 1,
          price: p.price,
          isCarton: p.isCarton || false,
          note: ''
        });
        if (!p.isCarton) g.lineName = p.name;
      });
    });

    map.forEach(g => {
      const boxEntries = g.supplierEntries.filter(e => !e.isCarton);
      const pool = boxEntries.length ? boxEntries : g.supplierEntries;
      const best = pool.reduce((a, b) => b.price > a.price ? b : a, pool[0]);
      g.selectedPrice = best ? best.price : 0;
      g.selectedQty = best ? best.qty : 0;
      g.selectedSupName = best ? best.supName : '';
    });

    lineGroups = Array.from(map.values());
    autoDetectCategories();

    const totalEntries = lineGroups.reduce((s, g) => s + g.supplierEntries.length, 0);
    const matched = lineGroups.filter(g => g.match).length;
    document.getElementById('parse-summary').textContent =
      `✨ AI解析: ${lineGroups.length} 商品 (${totalEntries} エントリ) / マッチ: ${matched} 件`;

    renderLinePreview();
    document.getElementById('line-preview-section').style.display = lineGroups.length ? 'block' : 'none';
    updateApplyCount();
    showToast(`AI解析完了: ${lineGroups.length}商品を検出`, 'success');
  } catch (e) {
    showToast('AI解析エラー: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ AI解析';
  }
}

// ── LINE取込: 未マッチアイテムのカテゴリ自動推測 ──
function autoDetectCategories() {
  const OP_RE  = /^(OP|EB|PRB|ST|RP)-?\d/i;
  const YGO_RE = /遊戯王|yu.?gi|ユギオ/i;
  const WS_RE  = /ヴァイス|weiss|\bWS\b/i;
  const UA_RE  = /ユニオンアリーナ|union.?arena|\bUA\b/i;
  const DB_RE  = /ドラゴンボール|dragon.?ball|fusion.?world|\bDB\b/i;

  lineGroups.forEach(g => {
    if (g.match || g.overrideCat) return;
    const name = g.lineName || '';
    let cat = null;
    if (OP_RE.test(name))       cat = 'ワンピース未開封BOX';
    else if (UA_RE.test(name))  cat = 'ユニオンアリーナ未開封BOX';
    else if (DB_RE.test(name))  cat = 'ドラゴンボール未開封BOX';
    else if (YGO_RE.test(name)) cat = g.shrink === false ? '遊戯王 BOX シュリンクなし' : '遊戯王 BOX シュリンクあり';
    else if (WS_RE.test(name))  cat = g.shrink === false ? 'ヴァイス BOX シュリンクなし' : 'ヴァイス BOX シュリンクあり';
    else                        cat = g.shrink === false ? '未開封BOX シュリンクなし' : 'ポケカ未開封BOX';
    if (cat) g.overrideCat = cat;
  });
}

// ── LINE取込: プレビュー描画 ──────────────────────
function parseAndPreview() {
  const suppliers = getSuppliers();
  if (!suppliers.length) { showToast('テキストを貼り付けてください', 'error'); return; }

  lineGroups = buildGroups(suppliers);
  autoDetectCategories();

  const totalEntries = lineGroups.reduce((s, g) => s + g.supplierEntries.length, 0);
  const matched = lineGroups.filter(g => g.match).length;
  const summary = `${lineGroups.length} 商品検出 / マッチ: ${matched} 件 / 未マッチ: ${lineGroups.length - matched} 件`;
  document.getElementById('parse-summary').textContent = summary;
  const inl = document.getElementById('parse-summary-inline');
  if (inl) inl.textContent = summary;

  renderLinePreview();
  document.getElementById('line-preview-section').style.display = lineGroups.length ? 'block' : 'none';
  updateApplyCount();
}

function renderLinePreview() {
  const container = document.getElementById('line-preview-body');
  container.innerHTML = '';

  lineGroups.forEach((g, idx) => {
    const { match, lineName, shrink, supplierEntries, checked, selectedPrice, selectedQty, selectedSupName, overrideCat } = g;

    let matchedName = '', catLabel = '', oldPrice = '';
    if (match) {
      const item = data[match.catIdx].items[match.itemIdx];
      matchedName = item.name || item.nameJp || '';
      catLabel = data[match.catIdx].label;
      oldPrice = item.price || '';
    }

    // 業者BOX価格ピル（価格降順）
    const boxEntries = supplierEntries.filter(e => !e.isCarton);
    const priceOptions = [...new Map(boxEntries.map(e => [e.price, e])).values()]
      .sort((a, b) => b.price - a.price);
    const cartonEntries = supplierEntries.filter(e => e.isCarton);

    const pillsHtml = priceOptions.map(e => {
      const isSel = e.price === selectedPrice;
      return `<div class="sup-pill ${isSel ? 'selected' : ''}" onclick="setSelectedPrice(${idx}, ${e.price}, ${e.qty}, '${escHtml(e.supName)}')">
        <span class="sup-pill-name">${escHtml(e.supName)}</span>
        <span class="sup-pill-price">${formatPrice(e.price)}</span>
        <span class="sup-pill-qty">${e.qty}BOX</span>
      </div>`;
    }).join('');

    const cartonHtml = cartonEntries.length
      ? `<div style="font-size:0.72rem;color:#fa0;margin-top:0.2rem">
          📦 カートン: ${cartonEntries.map(e => `${formatPrice(e.price)}×${e.qty}個（${escHtml(e.supName)}）`).join(' / ')}
        </div>` : '';

    // 価格変化表示
    let priceChangeHtml = '';
    if (selectedPrice) {
      const newFmt = formatPrice(selectedPrice);
      if (oldPrice && oldPrice !== newFmt) {
        priceChangeHtml = `<div class="lp-price-row">
          <span class="price-old">${escHtml(oldPrice)}</span>
          <span class="price-arrow">→</span>
          <span class="price-new">${newFmt}</span>
          ${selectedQty ? `<span class="price-qty">${selectedQty}BOX</span>` : ''}
        </div>`;
      } else if (!oldPrice) {
        priceChangeHtml = `<div class="lp-price-row">
          <span class="price-new">${newFmt}</span>
          ${selectedQty ? `<span class="price-qty">${selectedQty}BOX</span>` : ''}
        </div>`;
      } else {
        priceChangeHtml = `<div class="lp-price-row"><span class="price-same">${escHtml(oldPrice)} (変化なし)</span></div>`;
      }
    } else {
      priceChangeHtml = `<div class="lp-price-row"><span style="color:#555;font-size:0.82rem">価格未選択</span></div>`;
    }

    const shrinkBadge = shrink
      ? `<span class="shrink-badge">シュリあり</span>`
      : `<span class="shrink-badge no-shrink">シュリなし</span>`;

    const badge = match
      ? `<span class="match-badge badge-ok">✓ マッチ</span>`
      : `<span class="match-badge badge-new">未マッチ</span>`;

    const catHtml = match
      ? `<span class="category-badge">${escHtml(catLabel)}</span>`
      : `<select class="cat-select-inline" onchange="setOverrideCat(${idx}, this.value)">
          <option value="">カテゴリ選択...</option>
          ${BOX_CATS_ALL.map(c => `<option value="${escHtml(c)}" ${overrideCat === c ? 'selected' : ''}>${escHtml(c)}</option>`).join('')}
        </select>`;

    const card = document.createElement('div');
    card.className = `lp-card ${match ? 'is-matched' : 'is-unmatched'} ${checked ? 'is-checked' : ''}`;
    card.innerHTML = `
      <div class="lp-card-check">
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="setChecked(${idx}, this.checked)">
      </div>
      <div class="lp-card-body">
        <div class="lp-name">
          ${escHtml(lineName)}${shrinkBadge}
        </div>
        ${matchedName ? `<div class="lp-match-name">${escHtml(matchedName)}</div>` : ''}
        <div class="lp-meta">${badge}${catHtml}</div>
        ${priceChangeHtml}
        ${cartonHtml}
      </div>
      <div class="lp-card-right">
        <div class="sup-prices">${pillsHtml || '<span style="color:#555;font-size:0.8rem">価格なし</span>'}</div>
      </div>`;
    container.appendChild(card);
  });

  const checkAll = document.getElementById('check-all');
  if (checkAll) checkAll.checked = lineGroups.every(g => g.checked);
}

function setChecked(idx, val) {
  lineGroups[idx].checked = val;
  updateApplyCount();
  const checkAll = document.getElementById('check-all');
  if (checkAll) checkAll.checked = lineGroups.every(g => g.checked);
  // カードのハイライト更新
  const cards = document.querySelectorAll('#line-preview-body .lp-card');
  if (cards[idx]) cards[idx].classList.toggle('is-checked', val);
}

function toggleAllChecks(val) {
  lineGroups.forEach(g => g.checked = val);
  renderLinePreview();
  updateApplyCount();
}

function setOverrideCat(idx, catLabel) {
  lineGroups[idx].overrideCat = catLabel || null;
}

function setSelectedPrice(idx, price, qty, sup) {
  lineGroups[idx].selectedPrice = price;
  lineGroups[idx].selectedQty = qty ? +qty : 0;
  lineGroups[idx].selectedSupName = sup || '';
  renderLinePreview();
}

function updateApplyCount() {
  const n = lineGroups.filter(g => g.checked).length;
  document.getElementById('apply-count').textContent = `${n} 件を適用します`;
}

// ── LINE取込: 一括適用 ────────────────────────────
async function applyLineImport() {
  const targets = lineGroups.filter(g => g.checked);
  if (!targets.length) { showToast('適用する項目がありません', 'error'); return; }

  const token = (document.getElementById('gh-token').value || localStorage.getItem('gh_token') || '').trim();
  if (!token) { showToast('GitHub Tokenを入力してください', 'error'); return; }

  showSaving(true);
  // GitHubから最新データを取得してベースにする（他の取込で追加したlineStockを保持するため）
  let newData;
  try {
    const ghRes = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${FILE_PATH}?_=${Date.now()}`);
    if (!ghRes.ok) throw new Error('GitHub fetch failed');
    newData = await ghRes.json();
  } catch(e) {
    showToast('GitHubから最新データ取得失敗、ローカルデータを使用します', 'error');
    newData = JSON.parse(JSON.stringify(data));
  }
  showSaving(false);

  let updated = 0;
  const priceChanges = [];   // Discord通知用
  const needTranslate = [];  // 英語名翻訳が必要な新規アイテム

  for (const g of targets) {
    const { match, overrideCat, selectedPrice, selectedQty, lineName } = g;
    if (!selectedPrice) continue;
    const newPrice = formatPrice(selectedPrice);
    const priceDate = new Date().toISOString().slice(0, 10);
    const lineStock = typeof selectedQty === 'number' && selectedQty > 0 ? selectedQty : 0;

    if (match) {
      const oldItem = newData[match.catIdx]?.items[match.itemIdx] || data[match.catIdx].items[match.itemIdx];
      const oldPriceNum = parseInt(String(oldItem.price || '').replace(/[^0-9]/g, '')) || 0;
      // 変動追跡
      if (oldPriceNum > 0 && (oldPriceNum !== selectedPrice || (oldItem.lineStock ?? -1) !== lineStock)) {
        priceChanges.push({
          name: oldItem.name, nameEn: oldItem.nameEn || '',
          oldPrice: oldPriceNum, newPrice: selectedPrice,
          oldStock: oldItem.lineStock ?? null, newStock: lineStock,
        });
      }
      newData[match.catIdx].items[match.itemIdx].price = newPrice;
      newData[match.catIdx].items[match.itemIdx].priceDate = priceDate;
      newData[match.catIdx].items[match.itemIdx].lineStock = lineStock;
      updated++;
    } else if (overrideCat) {
      const catIdx = newData.findIndex(cat => cat.label === overrideCat);
      const newItem = { name: lineName, price: newPrice, priceDate, lineStock };
      const insertIdx = catIdx >= 0 ? newData[catIdx].items.push(newItem) - 1 : 0;
      if (catIdx >= 0) needTranslate.push({ catIdx, itemIdx: insertIdx, name: lineName });
      else { newData.push({ label: overrideCat, items: [newItem] }); needTranslate.push({ catIdx: newData.length - 1, itemIdx: 0, name: lineName }); }
      updated++;
    }
  }

  if (!updated) { showToast('更新できる項目がありません（未マッチかつカテゴリ未選択）', 'error'); return; }

  // 新規アイテムの英語名をAI翻訳
  if (needTranslate.length) {
    try {
      const res = await fetch('/api/translate-names', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ names: needTranslate.map((t, i) => ({ id: String(i), name: t.name })) })
      });
      const { results } = await res.json();
      results?.forEach(r => {
        const t = needTranslate[parseInt(r.id)];
        if (t && r.nameEn) newData[t.catIdx].items[t.itemIdx].nameEn = r.nameEn;
      });
    } catch(e) { console.warn('翻訳失敗:', e.message); }
  }

  showSaving(true);
  try {
    const metaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!metaRes.ok) throw new Error(`GitHub API error: ${metaRes.status}`);
    const meta = await metaRes.json();

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
    const updateRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `LINE取込: ${updated}件更新 - ${new Date().toLocaleString('ja-JP')}`, content, sha: meta.sha })
    });
    if (!updateRes.ok) { const err = await updateRes.json(); throw new Error(err.message || updateRes.status); }

    data = newData;
    refreshCategoryFilter();
    renderTable();
    showToast(`${updated} 件をGitHubに保存しました ✓`, 'success');
    document.getElementById('line-preview-section').style.display = 'none';
    document.getElementById('parse-summary').textContent = '';

    // Discord通知
    const notifyEnabled = localStorage.getItem('discord_notify_enable') === 'true';
    if (notifyEnabled && priceChanges.length) {
      fetch('/api/notify-price-changes', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ changes: priceChanges })
      }).then(r => r.json()).then(r => {
        if (r.ok) showToast(`📣 Discord通知: ${r.sent}件`, 'success');
        else showToast('Discord通知失敗: ' + r.error, 'error');
      }).catch(() => {});
    }
  } catch(e) {
    showToast('保存失敗: ' + e.message, 'error');
  } finally {
    showSaving(false);
  }
}

const SC_FEDEX_FICP_EXTRA={A:700,D:1727,E:929,F:960,G:1260,H:1208,I:1125,J:2386,K:383,M:1024,N:775,O:488,Q:718,R:752,S:684,T:858,U:1345,V:446,W:466,X:590,Y:706,Z:503};

function scGetDhlZone(c){const t=c.trim();for(const[k,z]of Object.entries(SC_COUNTRY_ZONES)){if(t.toLowerCase()===k.toLowerCase())return z;}return 8;}
function scGetFxZone(c){const t=c.trim();for(const[k,z]of Object.entries(SC_FEDEX_ZONES)){if(t.toLowerCase()===k.toLowerCase())return z;}return 'J';}
function scCalcRateFromTable(rates,extra,zone,wk){if(wk<=20){const keys=Object.keys(rates).map(Number).sort((a,b)=>a-b);for(const k of keys){if(wk<=k)return rates[k];}return rates[20];}else if(wk<=30){return rates[20]+extra[zone]*(wk-20)*2;}else{return rates[20]+extra[zone]*20+extra[zone]*(wk-30);}}
function scGetDhlRate(zone,wG){const wk=Math.ceil(wG/500)*0.5;const ro=scCalcRateFromTable(SC_DHL_RATES_OLD[zone],SC_DHL_EXTRA_OLD,zone,wk);const rn=scCalcRateFromTable(SC_DHL_RATES_NEW[zone],SC_DHL_EXTRA_NEW,zone,wk);return rn<=ro?{rate:rn,isBtoC:true}:{rate:ro,isBtoC:false};}
function scCalcFx(rt,ex,zone,wk){const r=rt[zone];if(!r)return null;const w=Math.ceil(wk*2)/2;if(w<=20.5){const keys=Object.keys(r).map(Number).sort((a,b)=>a-b);for(const k of keys){if(w<=k)return r[k];}return r[20.5]||r[20];}else{return(r[20.5]||r[20])+(ex[zone]||0)*(w-20.5);}}

// BOX換算ロウ
let scBoxRowId = 0;
function scAddBoxRow() {
  const id = ++scBoxRowId;
  const div = document.createElement('div');
  div.className = 'sc-box-row';
  div.id = `sc-box-row-${id}`;
  div.innerHTML = `
    <select class="sc-box-select" onchange="quickCalcShipping()">
      <option value="300">ポケカBOX (300g)</option>
      <option value="350">ワンピースBOX (350g)</option>
      <option value="100">PSAカード (100g)</option>
      <option value="50">パック (50g)</option>
    </select>
    <input type="number" class="sc-box-qty" value="1" min="1" placeholder="数量" oninput="quickCalcShipping()">
    <span style="color:#888;font-size:0.82rem">BOX/枚</span>
    <button class="btn-remove-supplier" onclick="document.getElementById('sc-box-row-${id}').remove();quickCalcShipping()">✕</button>`;
  document.getElementById('sc-box-rows').appendChild(div);
  quickCalcShipping();
}

function scToggleMode() {
  const mode = document.querySelector('input[name="sc-mode"]:checked').value;
  document.getElementById('sc-gram-mode').style.display = mode === 'gram' ? 'flex' : 'none';
  document.getElementById('sc-box-mode').style.display  = mode === 'box'  ? 'block' : 'none';
  quickCalcShipping();
}

function scCalcWeightG() {
  const mode = document.querySelector('input[name="sc-mode"]:checked')?.value || 'gram';
  if (mode === 'gram') {
    return parseInt(document.getElementById('sc-gram').value) || 0;
  }
  // BOX換算
  let totalG = 0;
  let hasItems = false;
  document.querySelectorAll('#sc-box-rows .sc-box-row').forEach(row => {
    const gPerUnit = parseInt(row.querySelector('.sc-box-select').value) || 300;
    const qty = parseInt(row.querySelector('.sc-box-qty').value) || 0;
    totalG += gPerUnit * qty;
    if (qty > 0) hasItems = true;
  });
  if (hasItems) totalG += 500; // 梱包材
  return totalG;
}

function quickCalcShipping() {
  const country = document.getElementById('sc-country').value;
  const weightG = scCalcWeightG();
  const div = document.getElementById('sc-result');
  if (!country || weightG < 1) { div.style.display = 'none'; return; }

  const dhlZone = scGetDhlZone(country);
  const fxZone  = scGetFxZone(country);
  const weightKg = Math.ceil(weightG / 500) * 0.5;

  const { rate: dhlBase, isBtoC } = scGetDhlRate(dhlZone, weightG);
  const dhlFuel  = window._scFuelRate || 0.48;
  const dhlTotal = Math.ceil((dhlBase + Math.ceil(dhlBase * dhlFuel)) * 1.05);

  const fxFuel   = (window._scFedexFuelRate || 45.5) / 100;
  const toTotal  = r => r ? Math.ceil((r + Math.ceil(r * fxFuel)) * 1.10) : null;
  const fxIPE  = toTotal(scCalcFx(SC_FEDEX_IPE,  SC_FEDEX_IPE_EXTRA,  fxZone, weightKg));
  const fxIP   = toTotal(scCalcFx(SC_FEDEX_IP,   SC_FEDEX_IP_EXTRA,   fxZone, weightKg));
  const fxFICP = toTotal(scCalcFx(SC_FEDEX_FICP, SC_FEDEX_FICP_EXTRA, fxZone, weightKg));

  const prices = [dhlTotal, fxIPE, fxIP, fxFICP].filter(Boolean);
  const minPrice = Math.min(...prices);
  const fmt = n => n ? '¥' + n.toLocaleString('ja-JP') : '—';
  const isBest = (n) => n && n === minPrice;

  div.style.display = 'block';
  div.innerHTML = `
    <div class="sc-result-title">
      総重量: <b style="color:#fff">${weightKg} kg</b> &nbsp;|&nbsp; DHL Zone ${dhlZone} &nbsp;/&nbsp; FedEx Zone ${fxZone}
    </div>
    <div class="sc-carrier-row">
      <span class="sc-carrier-name">🟡 DHL Express${isBtoC ? '<span class="sc-carrier-badge">BtoC契約</span>' : ''}</span>
      <span class="sc-carrier-price ${isBest(dhlTotal) ? 'best' : ''}">${fmt(dhlTotal)}</span>
    </div>
    <div class="sc-carrier-row">
      <span class="sc-carrier-name">📦 FedEx Priority Express (IPE)</span>
      <span class="sc-carrier-price ${isBest(fxIPE) ? 'best' : ''}">${fmt(fxIPE)}</span>
    </div>
    <div class="sc-carrier-row">
      <span class="sc-carrier-name">📦 FedEx Priority (IP)</span>
      <span class="sc-carrier-price ${isBest(fxIP) ? 'best' : ''}">${fmt(fxIP)}</span>
    </div>
    <div class="sc-carrier-row">
      <span class="sc-carrier-name">📦 FedEx Connect Plus (FICP)</span>
      <span class="sc-carrier-price ${isBest(fxFICP) ? 'best' : ''}">${fmt(fxFICP)}</span>
    </div>
    <div class="sc-fuel-note">燃油サーチャージ: DHL ${Math.round(dhlFuel*100)}% / FedEx ${Math.round(fxFuel*100)}%（税込）</div>`;
}
